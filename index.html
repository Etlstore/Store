<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Trims Store Management System</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --navy:#1F3B4D; --teal:#39756A; --rust:#A65C4A; --cream:#F2EEE7;
  --ink:#20303A; --line:#DDD5C7; --white:#FFFFFF; --danger:#B3423A; --warn:#C68A2E;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--cream);color:var(--ink);}
.hidden{display:none !important;}

/* LOGIN */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy),var(--teal));}
.loginBox{background:var(--white);padding:40px;border-radius:10px;width:340px;box-shadow:0 20px 50px rgba(0,0,0,.25);}
.loginBox h1{font-size:20px;color:var(--navy);margin:0 0 4px;}
.loginBox p{color:#6b7a82;font-size:13px;margin:0 0 24px;}
.loginBox input{width:100%;padding:11px;margin-bottom:12px;border:1px solid var(--line);border-radius:6px;font-size:14px;}
.loginBox button{width:100%;padding:12px;background:var(--navy);color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;}
.loginBox button:hover{background:var(--teal);}
.loginErr{color:var(--danger);font-size:13px;margin-top:8px;}

/* APP SHELL */
#app{display:none;}
header.top{background:var(--navy);color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;}
header.top .brand{font-weight:700;font-size:17px;letter-spacing:.3px;}
header.top .brand span{color:#E8B89B;}
header.top .userinfo{font-size:13px;display:flex;align-items:center;gap:14px;}
header.top button{background:var(--rust);color:#fff;border:none;padding:7px 14px;border-radius:5px;cursor:pointer;font-size:13px;}

nav.tabs{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 16px;overflow-x:auto;}
nav.tabs button{padding:13px 16px;border:none;background:none;cursor:pointer;font-size:13.5px;color:#5a6a72;border-bottom:3px solid transparent;white-space:nowrap;}
nav.tabs button.active{color:var(--navy);border-bottom-color:var(--rust);font-weight:600;}
nav.tabs button:hover{color:var(--navy);}

main{padding:22px;max-width:1300px;margin:0 auto;}
.card{background:#fff;border-radius:8px;padding:20px;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.card h2{margin:0 0 14px;font-size:17px;color:var(--navy);border-bottom:2px solid var(--cream);padding-bottom:10px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}
.stat{background:var(--cream);border-radius:8px;padding:16px;border-left:4px solid var(--teal);}
.stat.warn{border-left-color:var(--warn);}
.stat .num{font-size:26px;font-weight:700;color:var(--navy);}
.stat .lbl{font-size:12px;color:#6b7a82;margin-top:2px;}

form.inline{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:16px;}
form.inline .fld{display:flex;flex-direction:column;gap:4px;}
form.inline label{font-size:11.5px;color:#6b7a82;font-weight:600;}
input,select{padding:8px 10px;border:1px solid var(--line);border-radius:5px;font-size:13.5px;background:#fff;}
button.btn{padding:9px 16px;background:var(--navy);color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:13.5px;font-weight:600;}
button.btn:hover{background:var(--teal);}
button.btn.rust{background:var(--rust);}
button.btn.rust:hover{background:#8f4a3c;}
button.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--navy);}

table{width:100%;border-collapse:collapse;font-size:13px;}
table th{background:var(--navy);color:#fff;padding:9px 10px;text-align:left;font-weight:600;position:sticky;top:0;}
table td{padding:8px 10px;border-bottom:1px solid var(--line);}
table tr:hover td{background:#faf8f4;}
.tablewrap{overflow-x:auto;max-height:520px;overflow-y:auto;}
.badge{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;}
.badge.low{background:#FBE4E1;color:var(--danger);}
.badge.ok{background:#E1EFEA;color:var(--teal);}
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;justify-content:space-between;align-items:center;}
.toolbar .actions{display:flex;gap:8px;}
.muted{color:#8a97a0;font-size:12.5px;}
.tag{background:var(--cream);padding:2px 8px;border-radius:4px;font-size:11.5px;color:var(--navy);font-weight:600;}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="loginScreen">
  <div class="loginBox">
    <h1>E-Trims Store Management</h1>
    <p>Enam Trims Ltd. — Inventory &amp; Ledger System</p>
    <form id="loginForm" onsubmit="event.preventDefault(); doLogin();">
      <input id="loginUser" name="username" placeholder="Username" autocomplete="username">
      <input id="loginPass" name="password" type="password" placeholder="Password" autocomplete="current-password">
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:#5a6a72;margin-bottom:14px;">
        <input type="checkbox" id="rememberMe" style="width:auto;margin:0;" checked> Keep me signed in on this device
      </label>
      <button type="submit">Sign In</button>
    </form>
    <div class="loginErr hidden" id="loginErr">Invalid username or password.</div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app">
  <header class="top">
    <div class="brand">E-TRIMS <span>STORE</span></div>
    <div class="userinfo">
      <span id="whoami"></span>
      <button onclick="logout()">Log out</button>
    </div>
  </header>

  <nav class="tabs" id="tabBar"></nav>

  <main id="mainArea"></main>
</div>

<script>
/* ============================================================
   CONFIG — paste your Supabase project URL + anon key below
   ============================================================ */
const SUPABASE_URL = "https://zljvvfxjxxnfhqskgxnx.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpsanZ2ZnhqeHhuZmhxc2tneG54Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5MzA0NjEsImV4cCI6MjEwMjUwNjQ2MX0.NRCSxxnbrGTs1EOB2Zg8K4m0--loXTGyQ8qk0K6ug8s";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let CURRENT_USER = null;
let STORES = [], ITEMS = [], SUPPLIERS = [];
let ACTIVE_TAB = "dashboard";
let USER_PERMS = {}; // page_id -> {can_view, can_edit} for CURRENT_USER's role

const PAGE_DEFS = [
  {id:'dashboard', label:'Dashboard'},
  {id:'grn', label:'GRN (Stock In)'},
  {id:'issues', label:'Issue (Stock Out)'},
  {id:'transfers', label:'Transfers'},
  {id:'stock', label:'Stock Balance'},
  {id:'ledger', label:'Daily / Ledger Report'},
  {id:'items', label:'Items'},
  {id:'suppliers', label:'Suppliers'},
  {id:'stores', label:'Stores'},
  {id:'users', label:'Users'},
];
const ASSIGNABLE_ROLES = ['store_manager','store_keeper','accounts','management','admin'];

async function loadPermissions(){
  if(CURRENT_USER.role === 'admin'){
    USER_PERMS = {};
    PAGE_DEFS.forEach(p => USER_PERMS[p.id] = {can_view:true, can_edit:true});
    return;
  }
  const { data } = await sb.from('role_permissions').select('*').eq('role', CURRENT_USER.role);
  USER_PERMS = {};
  (data||[]).forEach(r => USER_PERMS[r.page_id] = {can_view: r.can_view, can_edit: r.can_edit});
}
function canView(pageId){
  if(CURRENT_USER.role === 'admin') return true;
  return !!(USER_PERMS[pageId] && USER_PERMS[pageId].can_view);
}
function canEdit(pageId){
  if(CURRENT_USER.role === 'admin') return true;
  return !!(USER_PERMS[pageId] && USER_PERMS[pageId].can_edit);
}
function noEditNotice(pageLabel){
  return `<div class="card"><p class="muted">You have view-only access to ${pageLabel}. Ask your admin to grant edit access if you need to add entries here.</p></div>`;
}
function isAdmin(){
  return CURRENT_USER.role === 'admin';
}
function canSeeValue(){
  return ['admin','accounts','management'].includes(CURRENT_USER.role);
}

/* ---------------- LOGIN ---------------- */
async function doLogin(){
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const remember = document.getElementById('rememberMe').checked;
  const errEl = document.getElementById('loginErr');
  errEl.classList.add('hidden');
  const { data, error } = await sb.from('app_users').select('*').eq('username', u).eq('is_active', true).limit(1);
  if(error || !data || data.length===0 || data[0].password_hash !== p){
    errEl.classList.remove('hidden');
    return;
  }
  CURRENT_USER = data[0];
  const store = remember ? localStorage : sessionStorage;
  store.setItem('etrims_store_user', JSON.stringify(CURRENT_USER));
  // clear the other storage so a stale copy doesn't linger
  (remember ? sessionStorage : localStorage).removeItem('etrims_store_user');
  enterApp();
}
function logout(){
  sessionStorage.removeItem('etrims_store_user');
  localStorage.removeItem('etrims_store_user');
  CURRENT_USER = null;
  document.getElementById('app').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
}
window.addEventListener('load', async ()=>{
  const saved = localStorage.getItem('etrims_store_user') || sessionStorage.getItem('etrims_store_user');
  if(saved){ CURRENT_USER = JSON.parse(saved); await enterApp(); }
});

async function enterApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('whoami').textContent = `${CURRENT_USER.full_name} (${CURRENT_USER.role})`;
  await loadMasters();
  await loadPermissions();
  buildTabs();
  showTab(canView('dashboard') ? 'dashboard' : (PAGE_DEFS.find(p=>canView(p.id))?.id || 'dashboard'));
}

async function loadMasters(){
  const [s,i,sup] = await Promise.all([
    sb.from('stores').select('*').eq('is_active',true).order('name'),
    sb.from('items').select('*').eq('is_active',true).order('item_name'),
    sb.from('suppliers').select('*').order('name')
  ]);
  STORES = s.data || []; ITEMS = i.data || []; SUPPLIERS = sup.data || [];
}

/* ---------------- TABS (driven by role_permissions, set anytime by admin) ---------------- */
function buildTabs(){
  const bar = document.getElementById('tabBar');
  bar.innerHTML='';
  PAGE_DEFS.filter(p=>canView(p.id)).forEach(p=>{
    const b = document.createElement('button');
    b.textContent = p.label; b.id = 'tab_'+p.id;
    b.onclick = ()=>showTab(p.id);
    bar.appendChild(b);
  });
  if(CURRENT_USER.role === 'admin'){
    const b = document.createElement('button');
    b.textContent = 'Permissions'; b.id = 'tab_permissions';
    b.onclick = ()=>showTab('permissions');
    bar.appendChild(b);
  }
}
function showTab(id){
  if(id !== 'permissions' && !canView(id)){
    document.getElementById('mainArea').innerHTML = `<div class="card"><p class="muted">You don't have access to this page. Ask your admin to grant view access.</p></div>`;
    return;
  }
  ACTIVE_TAB = id;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
  const btn = document.getElementById('tab_'+id); if(btn) btn.classList.add('active');
  const renderers = {
    dashboard: renderDashboard, grn: renderGRN, issues: renderIssues,
    transfers: renderTransfers, stock: renderStock, ledger: renderLedger,
    items: renderItems, suppliers: renderSuppliers, stores: renderStores, users: renderUsers,
    permissions: renderPermissions
  };
  (renderers[id]||renderDashboard)();
}

function fmt(n){ return Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function genNo(prefix){ return prefix + '-' + Date.now().toString().slice(-8); }
function storeOptions(sel){ return STORES.map(s=>`<option value="${s.id}" ${sel===s.id?'selected':''}>${s.name}</option>`).join(''); }
function itemOptions(sel){ return ITEMS.map(i=>`<option value="${i.id}" ${sel===i.id?'selected':''}>${i.item_code} — ${i.item_name}</option>`).join(''); }

/* ---------------- DASHBOARD ---------------- */
async function renderDashboard(){
  const el = document.getElementById('mainArea');
  el.innerHTML = `<div class="card"><h2>Loading dashboard…</h2></div>`;
  const { data: balances } = await sb.from('v_stock_balance').select('*');
  const rows = balances || [];
  const totalItems = new Set(rows.map(r=>r.item_id)).size;
  const lowStock = rows.filter(r=>r.reorder_level>0 && r.balance_qty < r.reorder_level);
  const byStore = {};
  STORES.forEach(s=> byStore[s.name] = rows.filter(r=>r.store_id===s.id).reduce((a,b)=>a+Number(b.balance_qty||0),0));

  el.innerHTML = `
    <div class="card">
      <h2>Store Overview — ${new Date().toDateString()}</h2>
      <div class="grid">
        <div class="stat"><div class="num">${totalItems}</div><div class="lbl">Active items with stock</div></div>
        <div class="stat ${lowStock.length?'warn':''}"><div class="num">${lowStock.length}</div><div class="lbl">Items below reorder level</div></div>
        <div class="stat"><div class="num">${STORES.length}</div><div class="lbl">Stores tracked</div></div>
      </div>
    </div>
    <div class="card">
      <h2>Stock by Store (total qty across items)</h2>
      <div class="grid">
        ${STORES.map(s=>`<div class="stat"><div class="num">${fmt(byStore[s.name]||0)}</div><div class="lbl">${s.name}</div></div>`).join('')}
      </div>
    </div>
    <div class="card">
      <h2>Low Stock Alerts</h2>
      ${lowStock.length===0 ? '<p class="muted">No items below reorder level.</p>' : `
      <div class="tablewrap"><table>
        <tr><th>Item</th><th>Store</th><th>Batch</th><th>Balance</th><th>Reorder Level</th><th>Status</th></tr>
        ${lowStock.map(r=>`<tr><td>${r.item_code} — ${r.item_name}</td><td>${r.store_name}</td><td>${r.batch_no||'-'}</td><td>${fmt(r.balance_qty)} ${r.uom}</td><td>${fmt(r.reorder_level)}</td><td><span class="badge low">LOW</span></td></tr>`).join('')}
      </table></div>`}
    </div>`;
}

/* ---------------- GRN (Stock In) ---------------- */
let editingGrnId = null;
async function renderGRN(){
  const el = document.getElementById('mainArea');
  const { data: recent } = await sb.from('grn').select('*,items(item_code,item_name,uom),stores(name),suppliers(name)').order('created_at',{ascending:false}).limit(30);
  const editable = canEdit('grn');
  const adminMode = isAdmin();
  editingGrnId = null;
  el.innerHTML = `
    ${editable ? `
    <div class="card" id="grnFormCard">
      <h2 id="grnFormTitle">New GRN — Stock In</h2>
      <form class="inline" onsubmit="submitGRN(event)">
        <div class="fld"><label>GRN Date</label><input type="date" id="g_date" value="${todayStr()}" required onchange="autoFillGRN()"></div>
        <div class="fld"><label>Store</label><select id="g_store" required><option value="">Select</option>${storeOptions()}</select></div>
        <div class="fld"><label>Item</label><select id="g_item" required onchange="autoFillGRN()"><option value="">Select</option>${itemOptions()}</select></div>
        <div class="fld"><label>Batch / Lot No. <span class="muted">(auto, editable)</span></label><input id="g_batch" placeholder="Select an item first" required></div>
        <div class="fld"><label>Qty</label><input type="number" id="g_qty" step="0.01" min="0.01" required></div>
        <div class="fld"><label>Unit Cost <span class="muted">(auto, editable)</span></label><input type="number" id="g_cost" step="0.01" value="0"></div>
        <div class="fld"><label>Supplier</label><select id="g_supplier"><option value="">-</option>${SUPPLIERS.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select></div>
        <div class="fld"><label>PO Ref</label><input id="g_po" placeholder="PO number"></div>
        <div class="fld"><button class="btn" type="submit" id="g_submit_btn">Save GRN</button></div>
        <div class="fld" id="g_cancel_wrap" style="display:none;"><button class="btn ghost" type="button" onclick="renderGRN()">Cancel</button></div>
      </form>
      <div class="toolbar" style="margin-top:8px;border-top:1px solid var(--line);padding-top:14px;">
        <div class="fld"><label>New Supplier Name</label><input id="g_new_supplier" placeholder="Type supplier name" style="min-width:220px;"></div>
        <button type="button" class="btn ghost" onclick="addSupplierQuick()">+ Add Supplier</button>
      </div>
      <p class="muted">Suppliers on file: ${SUPPLIERS.length===0 ? 'none yet — add one above' : SUPPLIERS.map(s=>s.name).join(', ')}</p>
    </div>` : noEditNotice('GRN entry')}
    <div class="card">
      <h2>Recent GRN Entries</h2>
      ${adminMode ? '<p class="muted">As admin you can edit or delete any entry here. Store keepers can only add new entries — corrections go through you.</p>' : ''}
      <div class="tablewrap"><table>
        <tr><th>GRN No.</th><th>Date</th><th>Store</th><th>Item</th><th>Batch</th><th>Qty</th><th>Supplier</th><th>PO Ref</th>${adminMode?'<th>Actions</th>':''}</tr>
        ${(recent||[]).map(r=>`<tr><td>${r.grn_no}</td><td>${r.grn_date}</td><td>${r.stores?.name||''}</td><td>${r.items?.item_code} — ${r.items?.item_name}</td><td>${r.batch_no}</td><td>${fmt(r.qty)} ${r.items?.uom||''}</td><td>${r.suppliers?.name||'-'}</td><td>${r.po_ref||'-'}</td>${adminMode?`<td><button class="btn ghost" style="padding:5px 10px;font-size:12px;" onclick='startEditGRN(${JSON.stringify(r)})'>Edit</button> <button class="btn rust" style="padding:5px 10px;font-size:12px;" onclick="deleteGRN('${r.id}','${r.grn_no}')">Delete</button></td>`:''}</tr>`).join('')}
      </table></div>
    </div>`;
}
function startEditGRN(r){
  editingGrnId = r.id;
  document.getElementById('grnFormTitle').textContent = `Edit GRN — ${r.grn_no}`;
  document.getElementById('g_date').value = r.grn_date;
  document.getElementById('g_store').value = r.store_id;
  document.getElementById('g_item').value = r.item_id;
  document.getElementById('g_batch').value = r.batch_no;
  document.getElementById('g_qty').value = r.qty;
  document.getElementById('g_cost').value = r.unit_cost;
  document.getElementById('g_supplier').value = r.supplier_id || '';
  document.getElementById('g_po').value = r.po_ref || '';
  document.getElementById('g_submit_btn').textContent = 'Update GRN';
  document.getElementById('g_cancel_wrap').style.display = '';
  document.getElementById('grnFormCard').scrollIntoView({behavior:'smooth'});
}
async function deleteGRN(id, grnNo){
  if(!confirm(`Delete GRN "${grnNo}"? This will reduce stock balance accordingly. Can't be undone.`)) return;
  const { error } = await sb.from('grn').delete().eq('id', id);
  if(error){ alert('Error deleting: '+error.message); return; }
  renderGRN();
}
async function submitGRN(ev){
  ev.preventDefault();
  const payload = {
    grn_date: document.getElementById('g_date').value,
    store_id: document.getElementById('g_store').value, item_id: document.getElementById('g_item').value,
    batch_no: document.getElementById('g_batch').value, qty: parseFloat(document.getElementById('g_qty').value),
    unit_cost: parseFloat(document.getElementById('g_cost').value||0),
    supplier_id: document.getElementById('g_supplier').value || null,
    po_ref: document.getElementById('g_po').value
  };
  if(editingGrnId){
    if(!isAdmin()){ alert('Only admin can edit existing GRN entries.'); return; }
    const { error } = await sb.from('grn').update(payload).eq('id', editingGrnId);
    if(error){ alert('Error updating GRN: '+error.message); return; }
  } else {
    payload.grn_no = genNo('GRN');
    payload.created_by = CURRENT_USER.id;
    const { error } = await sb.from('grn').insert(payload);
    if(error){ alert('Error saving GRN: '+error.message); return; }
  }
  renderGRN();
}
async function autoFillGRN(){
  const itemId = document.getElementById('g_item').value;
  if(!itemId) return;
  const item = ITEMS.find(i=>i.id===itemId);
  if(!item) return;
  document.getElementById('g_cost').value = item.standard_cost || 0;
  const dateStr = (document.getElementById('g_date').value || todayStr()).replace(/-/g,'');
  const { count } = await sb.from('grn').select('id',{count:'exact',head:true}).eq('item_id', itemId).eq('grn_date', document.getElementById('g_date').value || todayStr());
  const seq = (count||0)+1;
  document.getElementById('g_batch').value = `${item.item_code}-${dateStr}-${String(seq).padStart(3,'0')}`;
}
async function addSupplierQuick(){
  const name = document.getElementById('g_new_supplier').value.trim();
  if(!name) return;
  const { error } = await sb.from('suppliers').insert({name});
  if(error){ alert('Error adding supplier: '+error.message); return; }
  await loadMasters();
  renderGRN();
}

/* ---------------- ISSUES (Stock Out) ---------------- */
let editingIssueId = null;
async function renderIssues(){
  const el = document.getElementById('mainArea');
  const { data: recent } = await sb.from('issues').select('*,items(item_code,item_name,uom),stores(name)').order('created_at',{ascending:false}).limit(30);
  const editable = canEdit('issues');
  const adminMode = isAdmin();
  editingIssueId = null;
  el.innerHTML = `
    ${editable ? `
    <div class="card" id="issueFormCard">
      <h2 id="issueFormTitle">New Issue — Stock Out</h2>
      <form class="inline" onsubmit="submitIssue(event)">
        <div class="fld"><label>Issue Date</label><input type="date" id="i_date" value="${todayStr()}" required></div>
        <div class="fld"><label>Store</label><select id="i_store" required><option value="">Select</option>${storeOptions()}</select></div>
        <div class="fld"><label>Item</label><select id="i_item" required><option value="">Select</option>${itemOptions()}</select></div>
        <div class="fld"><label>Batch / Lot No.</label><input id="i_batch" placeholder="e.g. B-2026-081" required></div>
        <div class="fld"><label>Qty</label><input type="number" id="i_qty" step="0.01" min="0.01" required></div>
        <div class="fld"><label>Issued To (Department)</label>

function startEditIssue(r){

async function submitIssue(ev){
  ev.preventDefault();
  const deptSelect = document.getElementById('i_to').value;
  const issuedTo = deptSelect === 'Other' ? document.getElementById('i_to_other').value.trim() : deptSelect;
  const payload = {

    issued_to: issuedTo, style_no: document.getElementById('i_style').value, order_ref: document.getElementById('i_ref').value
  };
  if(editingIssueId){
    if(!isAdmin()){ alert('Only admin can edit existing issue entries.'); return; }
    const { error } = await sb.from('issues').update(payload).eq('id', editingIssueId);
    if(error){ alert('Error updating issue: '+error.message); return; }
  } else {
    payload.issue_no = genNo('ISS');
    payload.created_by = CURRENT_USER.id;
    const { error } = await sb.from('issues').insert(payload);
    if(error){ alert('Error saving issue: '+error.message); return; }
  }
  renderIssues();
}

  el.innerHTML = `

    </div>
    <div class="card" id="ledgerResult"></div>`;
  runLedger();
}
let ledgerReportType = 'summary';
function toggleLedgerType(){
  ledgerReportType = document.getElementById('l_type').value;
  document.getElementById('l_item_fld').classList.toggle('hidden', ledgerReportType!=='stockcard');
  if(ledgerReportType==='stockcard') runStockCard(); else runLedger();
}
async function runLedger(){
  const from = document.getElementById('l_from').value, to = document.getElementById('l_to').value;
  const storeFilter = document.getElementById('l_store').value;
  const resultEl = document.getElementById('ledgerResult');
  resultEl.innerHTML = '<p class="muted">Loading…</p>';

  let q = sb.from('v_daily_movement').select('*').gte('move_date', from).lte('move_date', to);
  const { data: moves, error } = await q;
  if(error){ resultEl.innerHTML = `<p class="muted">Error: ${error.message}</p>`; return; }
  let rows = moves || [];
  if(storeFilter) rows = rows.filter(r=>r.store_id===storeFilter);
  rows.forEach(r=>{ r.items = ITEMS.find(i=>i.id===r.item_id); r.stores = STORES.find(s=>s.id===r.store_id); });

  // opening balance = movement before 'from' date
  let openMoves = (await sb.from('v_daily_movement').select('*').lt('move_date', from)).data || [];
  if(storeFilter) openMoves = openMoves.filter(r=>r.store_id===storeFilter);

  const key = r => `${r.store_id}||${r.item_id}||${r.batch_no}`;
  const opening = {};
  openMoves.forEach(m=>{ const k=key(m); opening[k]=(opening[k]||0)+Number(m.in_qty||0)-Number(m.out_qty||0); });

  const summary = {};
  rows.forEach(r=>{
    const k = key(r);
    if(!summary[k]) summary[k] = {
      store: r.stores?.name, item_id: r.item_id, item_code: r.items?.item_code, item_name: r.items?.item_name,
      uom: r.items?.uom, batch: r.batch_no, in: 0, out: 0
    };
    summary[k].in += Number(r.in_qty||0);
    summary[k].out += Number(r.out_qty||0);
  });
  const summaryRows = Object.entries(summary).map(([k,v])=>{
    const cost = ITEMS.find(i=>i.id===v.item_id)?.standard_cost || 0;
    const openingQty = opening[k]||0;
    const closingQty = openingQty+v.in-v.out;
    return {
      ...v, opening: openingQty, closing: closingQty, cost,
      openingAmt: openingQty*cost, inAmt: v.in*cost, outAmt: v.out*cost, closingAmt: closingQty*cost
    };
  }).sort((a,b)=> a.item_name.localeCompare(b.item_name));

  window._ledgerSummary = summaryRows;
  window._ledgerDetail = rows.sort((a,b)=> a.move_date.localeCompare(b.move_date)).map(r=>{
    const cost = ITEMS.find(i=>i.id===r.item_id)?.standard_cost || 0;
    return { ...r, inAmt: Number(r.in_qty||0)*cost, outAmt: Number(r.out_qty||0)*cost };
  });

  const totalIn = summaryRows.reduce((a,b)=>a+b.in,0);
  const totalOut = summaryRows.reduce((a,b)=>a+b.out,0);
  const totalClosingAmt = summaryRows.reduce((a,b)=>a+b.closingAmt,0);
  const showValue = canSeeValue();

  document.getElementById('ledgerResult').innerHTML = `
    <div class="toolbar">
      <h2 style="margin:0;border:none;padding:0;">Ledger: ${from} to ${to} ${storeFilter? '— '+STORES.find(s=>s.id===storeFilter)?.name : '(All Stores)'}</h2>
      <div class="actions">
        <button class="btn ghost" onclick="exportLedgerPDF()">Export PDF</button>
        <button class="btn ghost" onclick="exportLedgerExcel()">Export Excel</button>
      </div>
    </div>
    <div class="grid" style="margin-bottom:16px;">
      <div class="stat"><div class="num">${summaryRows.length}</div><div class="lbl">Item-batches moved</div></div>
      <div class="stat"><div class="num">${fmt(totalIn)}</div><div class="lbl">Total In (qty)</div></div>
      <div class="stat"><div class="num">${fmt(totalOut)}</div><div class="lbl">Total Out (qty)</div></div>
      ${showValue ? `<div class="stat"><div class="num">৳${fmt(totalClosingAmt)}</div><div class="lbl">Total Closing Value</div></div>` : ''}
    </div>
    <h3 style="font-size:14px;color:var(--navy);">Summary (Opening / In / Out / Closing${showValue?' — Qty &amp; Value':' Qty'})</h3>
    ${showValue ? `<p class="muted">Value columns use each item's Standard Cost (set on the Items tab). Update standard cost there for accurate valuation.</p>` : ''}
    <div class="tablewrap">
      <table>
        <tr><th>Store</th><th>Item</th><th>Batch</th><th>Opening Qty</th><th>In Qty</th><th>Out Qty</th><th>Closing Qty</th>${showValue?'<th>Opening Amt</th><th>In Amt</th><th>Out Amt</th><th>Closing Amt</th>':''}</tr>
        ${summaryRows.map(r=>`<tr><td>${r.store}</td><td>${r.item_code} — ${r.item_name}</td><td>${r.batch}</td><td>${fmt(r.opening)}</td><td>${fmt(r.in)}</td><td>${fmt(r.out)}</td><td><b>${fmt(r.closing)}</b> ${r.uom}</td>${showValue?`<td>৳${fmt(r.openingAmt)}</td><td>৳${fmt(r.inAmt)}</td><td>৳${fmt(r.outAmt)}</td><td><b>৳${fmt(r.closingAmt)}</b></td>`:''}</tr>`).join('')}
      </table>
    </div>
    <h3 style="font-size:14px;color:var(--navy);margin-top:20px;">Detailed Transactions</h3>
    <div class="tablewrap">
      <table>
        <tr><th>Date</th><th>Store</th><th>Item</th><th>Batch</th><th>Type</th><th>Ref No.</th><th>In</th><th>Out</th>${showValue?'<th>In Amt</th><th>Out Amt</th>':''}</tr>
        ${window._ledgerDetail.map(r=>`<tr><td>${r.move_date}</td><td>${r.stores?.name}</td><td>${r.items?.item_code} — ${r.items?.item_name}</td><td>${r.batch_no}</td><td><span class="tag">${r.move_type}</span></td><td>${r.ref_no}</td><td>${r.in_qty?fmt(r.in_qty):''}</td><td>${r.out_qty?fmt(r.out_qty):''}</td>${showValue?`<td>${r.inAmt?'৳'+fmt(r.inAmt):''}</td><td>${r.outAmt?'৳'+fmt(r.outAmt):''}</td>`:''}</tr>`).join('')}
      </table>
    </div>`;
}
function exportLedgerExcel(){
  const showValue = canSeeValue();
  const wb = XLSX.utils.book_new();
  const wsSummary = XLSX.utils.json_to_sheet((window._ledgerSummary||[]).map(r=>{
    const row = { Store:r.store, ItemCode:r.item_code, ItemName:r.item_name, Batch:r.batch, UOM:r.uom, OpeningQty:r.opening, InQty:r.in, OutQty:r.out, ClosingQty:r.closing };
    if(showValue) Object.assign(row, { UnitCost:r.cost, OpeningAmt:r.openingAmt, InAmt:r.inAmt, OutAmt:r.outAmt, ClosingAmt:r.closingAmt });
    return row;
  }));
  XLSX.utils.book_append_sheet(wb, wsSummary, 'Summary');
  const wsDetail = XLSX.utils.json_to_sheet((window._ledgerDetail||[]).map(r=>{
    const row = { Date:r.move_date, Store:r.stores?.name, ItemCode:r.items?.item_code, ItemName:r.items?.item_name, Batch:r.batch_no, Type:r.move_type, RefNo:r.ref_no, In:r.in_qty, Out:r.out_qty };
    if(showValue) Object.assign(row, { InAmt:r.inAmt, OutAmt:r.outAmt });
    return row;
  }));
  XLSX.utils.book_append_sheet(wb, wsDetail, 'Detail');
  XLSX.writeFile(wb, `Store_Ledger_${document.getElementById('l_from').value}_to_${document.getElementById('l_to').value}.xlsx`);
}
function exportLedgerPDF(){
  const showValue = canSeeValue();
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:'landscape'});
  doc.setFontSize(14); doc.setTextColor(31,59,77);
  doc.text('E-Trims Ltd. — Store Ledger Report', 14, 15);
  doc.setFontSize(10); doc.setTextColor(80,80,80);
  doc.text(`Period: ${document.getElementById('l_from').value} to ${document.getElementById('l_to').value}`, 14, 22);

  const summaryHead = showValue
    ? ['Store','Item','Batch','Opening Qty','In Qty','Out Qty','Closing Qty','Opening Amt','In Amt','Out Amt','Closing Amt']
    : ['Store','Item','Batch','Opening Qty','In Qty','Out Qty','Closing Qty'];
  const summaryBody = (window._ledgerSummary||[]).map(r=>{
    const row = [r.store,`${r.item_code} ${r.item_name}`,r.batch,fmt(r.opening),fmt(r.in),fmt(r.out),fmt(r.closing)+' '+r.uom];
    if(showValue) row.push(fmt(r.openingAmt),fmt(r.inAmt),fmt(r.outAmt),fmt(r.closingAmt));
    return row;
  });
  doc.autoTable({
    startY: 28,
    head: [summaryHead], body: summaryBody,
    headStyles:{fillColor:[31,59,77]}, styles:{fontSize:7.5},
    margin:{left:14,right:14}
  });
  const y2 = doc.lastAutoTable.finalY + 10;
  doc.setFontSize(11); doc.setTextColor(31,59,77);
  doc.text('Detailed Transactions', 14, y2);
  const detailHead = showValue
    ? ['Date','Store','Item','Batch','Type','Ref No.','In','Out','In Amt','Out Amt']
    : ['Date','Store','Item','Batch','Type','Ref No.','In','Out'];
  const detailBody = (window._ledgerDetail||[]).map(r=>{
    const row = [r.move_date, r.stores?.name, `${r.items?.item_code} — ${r.items?.item_name}`, r.batch_no, r.move_type, r.ref_no, r.in_qty?fmt(r.in_qty):'', r.out_qty?fmt(r.out_qty):''];
    if(showValue) row.push(r.inAmt?fmt(r.inAmt):'', r.outAmt?fmt(r.outAmt):'');
    return row;
  });
  doc.autoTable({
    startY: y2+4,
    head: [detailHead], body: detailBody,
    headStyles:{fillColor:[57,117,106]}, styles:{fontSize:7.5},

/* ---------------- DAILY STOCK CARD (date-wise opening/in/out/closing, single item) ---------------- */
async function runStockCard(){
  const from = document.getElementById('l_from').value, to = document.getElementById('l_to').value;
  const storeFilter = document.getElementById('l_store').value;
  const itemId = document.getElementById('l_item').value;
  const resultEl = document.getElementById('ledgerResult');
  resultEl.innerHTML = '<p class="muted">Loading…</p>';
  if(!itemId){ resultEl.innerHTML = '<p class="muted">Select an item to see its daily stock card.</p>'; return; }

  const item = ITEMS.find(i=>i.id===itemId);

  // opening balance = net of all movement strictly before 'from'
  let openQ = sb.from('v_daily_movement').select('*').eq('item_id', itemId).lt('move_date', from);
  if(storeFilter) openQ = openQ.eq('store_id', storeFilter);
  const { data: beforeMoves } = await openQ;
  let openingBalance = (beforeMoves||[]).reduce((a,m)=> a + Number(m.in_qty||0) - Number(m.out_qty||0), 0);

  // movements within range
  let rangeQ = sb.from('v_daily_movement').select('*').eq('item_id', itemId).gte('move_date', from).lte('move_date', to);
  if(storeFilter) rangeQ = rangeQ.eq('store_id', storeFilter);
  const { data: rangeMoves, error } = await rangeQ;
  if(error){ resultEl.innerHTML = `<p class="muted">Error: ${error.message}</p>`; return; }

  // group by date
  const byDate = {};
  (rangeMoves||[]).forEach(m=>{
    if(!byDate[m.move_date]) byDate[m.move_date] = {in:0, out:0, refs:[]};
    byDate[m.move_date].in += Number(m.in_qty||0);
    byDate[m.move_date].out += Number(m.out_qty||0);
    byDate[m.move_date].refs.push(`${m.move_type} ${m.ref_no}`);
  });
  const dates = Object.keys(byDate).sort();

  let running = openingBalance;
  const cost = item.standard_cost || 0;
  const cardRows = dates.map(d=>{
    const day = byDate[d];
    const opening = running;
    const closing = opening + day.in - day.out;
    running = closing;
    return {
      date:d, opening, in:day.in, out:day.out, closing, refs: day.refs.join(', '),
      openingAmt: opening*cost, inAmt: day.in*cost, outAmt: day.out*cost, closingAmt: closing*cost
    };
  });
  window._stockCard = cardRows;
  window._stockCardMeta = { item, storeFilter, from, to, openingBalance, cost };
  const showValue = canSeeValue();

  resultEl.innerHTML = `
    <div class="toolbar">
      <h2 style="margin:0;border:none;padding:0;">Daily Stock Card — ${item.item_code} ${item.item_name}</h2>
      <div class="actions">
        <button class="btn ghost" onclick="exportStockCardPDF()">Export PDF</button>
        <button class="btn ghost" onclick="exportStockCardExcel()">Export Excel</button>
      </div>
    </div>
    <p class="muted">${storeFilter? STORES.find(s=>s.id===storeFilter)?.name : 'All Stores combined'} — Opening balance on ${from}: <b>${fmt(openingBalance)} ${item.uom}</b>${showValue?` (Standard Cost: ৳${fmt(cost)}/${item.uom})`:''}</p>
    ${cardRows.length===0 ? `<p class="muted">No movement between ${from} and ${to}. Balance stayed at ${fmt(openingBalance)} ${item.uom}${showValue?` (৳${fmt(openingBalance*cost)})`:''}.</p>` : `
    <div class="tablewrap">
      <table>
        <tr><th>Date</th><th>Opening Qty</th><th>Received</th><th>Issued</th><th>Closing Qty</th>${showValue?'<th>Opening Amt</th><th>Received Amt</th><th>Issued Amt</th><th>Closing Amt</th>':''}<th>Reference</th></tr>
        ${cardRows.map(r=>`<tr><td>${r.date}</td><td>${fmt(r.opening)}</td><td>${r.in?fmt(r.in):''}</td><td>${r.out?fmt(r.out):''}</td><td><b>${fmt(r.closing)}</b></td>${showValue?`<td>৳${fmt(r.openingAmt)}</td><td>${r.inAmt?'৳'+fmt(r.inAmt):''}</td><td>${r.outAmt?'৳'+fmt(r.outAmt):''}</td><td><b>৳${fmt(r.closingAmt)}</b></td>`:''}<td class="muted">${r.refs}</td></tr>`).join('')}
      </table>
    </div>`}`;
}
function exportStockCardExcel(){
  const meta = window._stockCardMeta;
  const showValue = canSeeValue();
  const ws = XLSX.utils.json_to_sheet((window._stockCard||[]).map(r=>{
    const row = { Date:r.date, OpeningQty:r.opening, ReceivedQty:r.in, IssuedQty:r.out, ClosingQty:r.closing };
    if(showValue) Object.assign(row, { UnitCost:meta.cost, OpeningAmt:r.openingAmt, ReceivedAmt:r.inAmt, IssuedAmt:r.outAmt, ClosingAmt:r.closingAmt });
    row.Reference = r.refs;
    return row;
  }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Stock Card');
  XLSX.writeFile(wb, `Stock_Card_${meta.item.item_code}_${meta.from}_to_${meta.to}.xlsx`);
}
function exportStockCardPDF(){
  const meta = window._stockCardMeta;
  const showValue = canSeeValue();
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:'landscape'});
  doc.setFontSize(14); doc.setTextColor(31,59,77);
  doc.text('E-Trims Ltd. — Daily Stock Card', 14, 15);
  doc.setFontSize(10); doc.setTextColor(80,80,80);
  doc.text(`Item: ${meta.item.item_code} — ${meta.item.item_name}`, 14, 22);
  doc.text(`Store: ${meta.storeFilter? STORES.find(s=>s.id===meta.storeFilter)?.name : 'All Stores'}  |  Period: ${meta.from} to ${meta.to}  |  Opening: ${fmt(meta.openingBalance)} ${meta.item.uom}${showValue?`  |  Std Cost: ৳${fmt(meta.cost)}`:''}`, 14, 28);
  const head = showValue
    ? ['Date','Opening Qty','Received','Issued','Closing Qty','Opening Amt','Received Amt','Issued Amt','Closing Amt']
    : ['Date','Opening Qty','Received','Issued','Closing Qty'];
  const body = (window._stockCard||[]).map(r=>{
    const row = [r.date, fmt(r.opening), r.in?fmt(r.in):'', r.out?fmt(r.out):'', fmt(r.closing)];
    if(showValue) row.push(fmt(r.openingAmt), r.inAmt?fmt(r.inAmt):'', r.outAmt?fmt(r.outAmt):'', fmt(r.closingAmt));
    return row;
  });
  doc.autoTable({
    startY: 34,
    head: [head], body: body,
    headStyles:{fillColor:[31,59,77]}, styles:{fontSize:8},
    margin:{left:14,right:14}
  });
  doc.save(`Stock_Card_${meta.item.item_code}_${meta.from}_to_${meta.to}.pdf`);
}

            <tr>
              <td><b>${role.replace('_',' ')}</b></td>
              ${rolePages.map(p=>{
                const rec = perms[`${role}||${p.id}`] || {can_view:false, can_edit:false};
                return `
                  <td style="text-align:center;"><input type="checkbox" id="perm_v_${role}_${p.id}" ${rec.can_view?'checked':''} onchange="if(!this.checked) document.getElementById('perm_e_${role}_${p.id}').checked=false;"></td>
                  <td style="text-align:center;"><input type="checkbox" id="perm_e_${role}_${p.id}" ${rec.can_edit?'checked':''} onchange="if(this.checked) document.getElementById('perm_v_${role}_${p.id}').checked=true;"></td>`;
              }).join('')}
            </tr>`).join('')}
        </table>
      </div>
    </div>`;
}
async function savePermissions(){
  const rolePages = PAGE_DEFS.filter(p => p.id !== 'permissions');
  const rows = [];
  ASSIGNABLE_ROLES.filter(r=>r!=='admin').forEach(role=>{
    rolePages.forEach(p=>{
      const v = document.getElementById(`perm_v_${role}_${p.id}`).checked;
      const e = document.getElementById(`perm_e_${role}_${p.id}`).checked;
      rows.push({role, page_id: p.id, can_view: v, can_edit: e});
    });
  });
  const { error } = await sb.from('role_permissions').upsert(rows, {onConflict:'role,page_id'});
  if(error){ alert('Error saving permissions: '+error.message); return; }
  alert('Permissions saved. They will apply next time each user logs in or refreshes the page.');
  if(CURRENT_USER.role==='admin') renderPermissions();
}
</script>
