<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Trims Store Management System</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --navy:#1F3B4D; --teal:#39756A; --rust:#A65C4A; --cream:#F2EEE7;
  --ink:#20303A; --line:#DDD5C7; --white:#FFFFFF; --danger:#B3423A; --warn:#C68A2E;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--cream);color:var(--ink);}
.hidden{display:none !important;}

/* LOGIN */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy),var(--teal));}
.loginBox{background:var(--white);padding:40px;border-radius:10px;width:340px;box-shadow:0 20px 50px rgba(0,0,0,.25);}
.loginBox h1{font-size:20px;color:var(--navy);margin:0 0 4px;}
.loginBox p{color:#6b7a82;font-size:13px;margin:0 0 24px;}
.loginBox input{width:100%;padding:11px;margin-bottom:12px;border:1px solid var(--line);border-radius:6px;font-size:14px;}
.loginBox button{width:100%;padding:12px;background:var(--navy);color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;}
.loginBox button:hover{background:var(--teal);}
.loginErr{color:var(--danger);font-size:13px;margin-top:8px;}

/* APP SHELL */
#app{display:none;}
header.top{background:var(--navy);color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;}
header.top .brand{font-weight:700;font-size:17px;letter-spacing:.3px;}
header.top .brand span{color:#E8B89B;}
header.top .userinfo{font-size:13px;display:flex;align-items:center;gap:14px;}
header.top button{background:var(--rust);color:#fff;border:none;padding:7px 14px;border-radius:5px;cursor:pointer;font-size:13px;}

nav.tabs{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 16px;overflow-x:auto;}
nav.tabs button{padding:13px 16px;border:none;background:none;cursor:pointer;font-size:13.5px;color:#5a6a72;border-bottom:3px solid transparent;white-space:nowrap;}
nav.tabs button.active{color:var(--navy);border-bottom-color:var(--rust);font-weight:600;}
nav.tabs button:hover{color:var(--navy);}

main{padding:22px;max-width:1300px;margin:0 auto;}
.card{background:#fff;border-radius:8px;padding:20px;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.card h2{margin:0 0 14px;font-size:17px;color:var(--navy);border-bottom:2px solid var(--cream);padding-bottom:10px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}
.stat{background:var(--cream);border-radius:8px;padding:16px;border-left:4px solid var(--teal);}
.stat.warn{border-left-color:var(--warn);}
.stat .num{font-size:26px;font-weight:700;color:var(--navy);}
.stat .lbl{font-size:12px;color:#6b7a82;margin-top:2px;}

form.inline{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:16px;}
form.inline .fld{display:flex;flex-direction:column;gap:4px;}
form.inline label{font-size:11.5px;color:#6b7a82;font-weight:600;}
input,select{padding:8px 10px;border:1px solid var(--line);border-radius:5px;font-size:13.5px;background:#fff;}
button.btn{padding:9px 16px;background:var(--navy);color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:13.5px;font-weight:600;}
button.btn:hover{background:var(--teal);}
button.btn.rust{background:var(--rust);}
button.btn.rust:hover{background:#8f4a3c;}
button.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--navy);}

table{width:100%;border-collapse:collapse;font-size:13px;}
table th{background:var(--navy);color:#fff;padding:9px 10px;text-align:left;font-weight:600;position:sticky;top:0;}
table td{padding:8px 10px;border-bottom:1px solid var(--line);}
table tr:hover td{background:#faf8f4;}
.tablewrap{overflow-x:auto;max-height:520px;overflow-y:auto;}
.badge{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;}
.badge.low{background:#FBE4E1;color:var(--danger);}
.badge.ok{background:#E1EFEA;color:var(--teal);}
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;justify-content:space-between;align-items:center;}
.toolbar .actions{display:flex;gap:8px;}
.muted{color:#8a97a0;font-size:12.5px;}
.tag{background:var(--cream);padding:2px 8px;border-radius:4px;font-size:11.5px;color:var(--navy);font-weight:600;}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="loginScreen">
  <div class="loginBox">
    <h1>E-Trims Store Management</h1>
    <p>Enam Trims Ltd. — Inventory &amp; Ledger System</p>
    <form id="loginForm" onsubmit="event.preventDefault(); doLogin();">
      <input id="loginUser" name="username" placeholder="Username" autocomplete="username">
      <input id="loginPass" name="password" type="password" placeholder="Password" autocomplete="current-password">
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:#5a6a72;margin-bottom:14px;">
        <input type="checkbox" id="rememberMe" style="width:auto;margin:0;" checked> Keep me signed in on this device
      </label>
      <button type="submit">Sign In</button>
    </form>
    <div class="loginErr hidden" id="loginErr">Invalid username or password.</div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app">
  <header class="top">
    <div class="brand">E-TRIMS <span>STORE</span></div>
    <div class="userinfo">
      <span id="whoami"></span>
      <button onclick="logout()">Log out</button>
    </div>
  </header>

  <nav class="tabs" id="tabBar"></nav>

  <main id="mainArea"></main>
  <datalist id="itemsDatalist"></datalist>
  <div id="scannerModal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:999;display:flex;align-items:center;justify-content:center;">
    <div style="background:#fff;border-radius:10px;padding:20px;width:90%;max-width:420px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <h3 style="margin:0;color:var(--navy);font-size:16px;">Scan Item Barcode</h3>
        <button class="btn ghost" style="padding:5px 10px;" onclick="closeScanner()">Close</button>
      </div>
      <div id="scannerViewport" style="width:100%;"></div>
      <p class="muted" id="scannerStatus" style="margin-top:10px;">Point the camera at a barcode or QR code.</p>
    </div>
  </div>
</div>

<script>
/* ============================================================
   CONFIG — paste your Supabase project URL + anon key below
   ============================================================ */
const SUPABASE_URL = "https://zljvvfxjxxnfhqskgxnx.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpsanZ2ZnhqeHhuZmhxc2tneG54Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5MzA0NjEsImV4cCI6MjEwMjUwNjQ2MX0.NRCSxxnbrGTs1EOB2Zg8K4m0--loXTGyQ8qk0K6ug8s";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let CURRENT_USER = null;
let STORES = [], ITEMS = [], SUPPLIERS = [];
let ACTIVE_TAB = "dashboard";
let USER_PERMS = {}; // page_id -> {can_view, can_edit} for CURRENT_USER's role

const PAGE_DEFS = [
  {id:'dashboard', label:'Dashboard'},
  {id:'grn', label:'GRN (Stock In)'},
  {id:'issues', label:'Issue (Stock Out)'},
  {id:'transfers', label:'Transfers'},
  {id:'stock', label:'Stock Balance'},
  {id:'ledger', label:'Daily / Ledger Report'},
  {id:'po', label:'Purchase Orders'},
  {id:'stockcount', label:'Stock Count'},
  {id:'reservations', label:'Reservations'},
  {id:'items', label:'Items'},
  {id:'suppliers', label:'Suppliers'},
  {id:'stores', label:'Stores'},
  {id:'users', label:'Users'},
];
const ASSIGNABLE_ROLES = ['store_manager','store_keeper','accounts','management','admin'];

async function loadPermissions(){
  if(CURRENT_USER.role === 'admin'){
    USER_PERMS = {};
    PAGE_DEFS.forEach(p => USER_PERMS[p.id] = {can_view:true, can_edit:true});
    return;
  }
  const { data } = await sb.from('role_permissions').select('*').eq('role', CURRENT_USER.role);
  USER_PERMS = {};
  (data||[]).forEach(r => USER_PERMS[r.page_id] = {can_view: r.can_view, can_edit: r.can_edit});
}
function canView(pageId){
  if(CURRENT_USER.role === 'admin') return true;
  return !!(USER_PERMS[pageId] && USER_PERMS[pageId].can_view);
}
function canEdit(pageId){
  if(CURRENT_USER.role === 'admin') return true;
  return !!(USER_PERMS[pageId] && USER_PERMS[pageId].can_edit);
}
function noEditNotice(pageLabel){
  return `<div class="card"><p class="muted">You have view-only access to ${pageLabel}. Ask your admin to grant edit access if you need to add entries here.</p></div>`;
}
function isAdmin(){
  return CURRENT_USER.role === 'admin';
}
function itemCost(itemId){
  const item = ITEMS.find(i=>i.id===itemId);
  if(!item) return 0;
  return (item.weighted_avg_cost && item.weighted_avg_cost>0) ? item.weighted_avg_cost : (item.standard_cost || 0);
}
function canSeeValue(){
  return ['admin','accounts','management'].includes(CURRENT_USER.role);
}
async function logAudit(tableName, recordId, action, oldData, newData){
  try{
    await sb.from('audit_log').insert({
      table_name: tableName, record_id: String(recordId), action,
      changed_by: CURRENT_USER.id, changed_by_name: CURRENT_USER.full_name,
      old_data: oldData || null, new_data: newData || null
    });
  }catch(e){ /* never block the main action if audit logging fails */ }
}
function getItemCost(itemId){
  const item = ITEMS.find(i=>i.id===itemId);
  if(!item) return 0;
  return (item.weighted_avg_cost && item.weighted_avg_cost>0) ? item.weighted_avg_cost : (item.standard_cost||0);
}
async function recalcWeightedAvgCost(itemId){
  if(!itemId) return;
  const { data: grns } = await sb.from('grn').select('qty,unit_cost').eq('item_id', itemId);
  const rows = grns || [];
  const totalQty = rows.reduce((a,g)=>a+Number(g.qty||0),0);
  const totalCost = rows.reduce((a,g)=>a+Number(g.qty||0)*Number(g.unit_cost||0),0);
  const avg = totalQty>0 ? totalCost/totalQty : 0;
  await sb.from('items').update({weighted_avg_cost: avg}).eq('id', itemId);
  const local = ITEMS.find(i=>i.id===itemId);
  if(local) local.weighted_avg_cost = avg;
}

/* ---------------- LOGIN ---------------- */
async function doLogin(){
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const remember = document.getElementById('rememberMe').checked;
  const errEl = document.getElementById('loginErr');
  errEl.classList.add('hidden');
  const { data, error } = await sb.from('app_users').select('*').eq('username', u).eq('is_active', true).limit(1);
  if(error || !data || data.length===0 || data[0].password_hash !== p){
    errEl.classList.remove('hidden');
    return;
  }
  CURRENT_USER = data[0];
  const store = remember ? localStorage : sessionStorage;
  store.setItem('etrims_store_user', JSON.stringify(CURRENT_USER));
  // clear the other storage so a stale copy doesn't linger
  (remember ? sessionStorage : localStorage).removeItem('etrims_store_user');
  enterApp();
}
function logout(){
  sessionStorage.removeItem('etrims_store_user');
  localStorage.removeItem('etrims_store_user');
  CURRENT_USER = null;
  document.getElementById('app').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
}
window.addEventListener('load', async ()=>{
  const saved = localStorage.getItem('etrims_store_user') || sessionStorage.getItem('etrims_store_user');
  if(saved){ CURRENT_USER = JSON.parse(saved); await enterApp(); }
});

async function enterApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('whoami').textContent = `${CURRENT_USER.full_name} (${CURRENT_USER.role})`;
  await loadMasters();
  await loadPermissions();
  buildTabs();
  showTab(canView('dashboard') ? 'dashboard' : (PAGE_DEFS.find(p=>canView(p.id))?.id || 'dashboard'));
}

async function loadMasters(){
  const [s,i,sup] = await Promise.all([
    sb.from('stores').select('*').eq('is_active',true).order('name'),
    sb.from('items').select('*').eq('is_active',true).order('item_name'),
    sb.from('suppliers').select('*').order('name')
  ]);
  STORES = s.data || []; ITEMS = i.data || []; SUPPLIERS = sup.data || [];
  const dl = document.getElementById('itemsDatalist');
  if(dl) dl.innerHTML = ITEMS.map(i=>`<option value="${i.item_code} — ${i.item_name}">`).join('');
}

/* ---------------- TABS (driven by role_permissions, set anytime by admin) ---------------- */
function buildTabs(){
  const bar = document.getElementById('tabBar');
  bar.innerHTML='';
  PAGE_DEFS.filter(p=>canView(p.id)).forEach(p=>{
    const b = document.createElement('button');
    b.textContent = p.label; b.id = 'tab_'+p.id;
    b.onclick = ()=>showTab(p.id);
    bar.appendChild(b);
  });
  if(CURRENT_USER.role === 'admin'){
    const b = document.createElement('button');
    b.textContent = 'Permissions'; b.id = 'tab_permissions';
    b.onclick = ()=>showTab('permissions');
    bar.appendChild(b);
  }
}
function showTab(id){
  if(id !== 'permissions' && !canView(id)){
    document.getElementById('mainArea').innerHTML = `<div class="card"><p class="muted">You don't have access to this page. Ask your admin to grant view access.</p></div>`;
    return;
  }
  ACTIVE_TAB = id;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
  const btn = document.getElementById('tab_'+id); if(btn) btn.classList.add('active');
  const renderers = {
    dashboard: renderDashboard, grn: renderGRN, issues: renderIssues,
    transfers: renderTransfers, stock: renderStock, ledger: renderLedger,
    po: renderPO, stockcount: renderStockCount, reservations: renderReservations,
    items: renderItems, suppliers: renderSuppliers, stores: renderStores, users: renderUsers,
    permissions: renderPermissions
  };
  (renderers[id]||renderDashboard)();
}

function fmt(n){ return Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function genNo(prefix){ return prefix + '-' + Date.now().toString().slice(-8); }
function storeOptions(sel){ return STORES.map(s=>`<option value="${s.id}" ${sel===s.id?'selected':''}>${s.name}</option>`).join(''); }
function itemOptions(sel){ return ITEMS.map(i=>`<option value="${i.id}" ${sel===i.id?'selected':''}>${i.item_code} — ${i.item_name}</option>`).join(''); }
function searchableItemSelect(id, extraOnchange){
  return `<input type="text" id="${id}_search" list="itemsDatalist" placeholder="Type code or name to search..." autocomplete="off" oninput="syncItemSearchInput('${id}')" style="min-width:230px;">
    <select id="${id}" style="display:none" ${extraOnchange?`onchange="${extraOnchange}"`:''}>${itemOptions()}</select>`;
}
function syncItemSearchInput(id){
  const typed = document.getElementById(id+'_search').value;
  const match = ITEMS.find(i => `${i.item_code} — ${i.item_name}` === typed);
  const sel = document.getElementById(id);
  sel.value = match ? match.id : '';
  sel.dispatchEvent(new Event('change'));
}
function setSearchableItemValue(id, itemId){
  const item = ITEMS.find(i=>i.id===itemId);
  document.getElementById(id+'_search').value = item ? `${item.item_code} — ${item.item_name}` : '';
  const sel = document.getElementById(id);
  sel.value = itemId;
  sel.dispatchEvent(new Event('change'));
}
let scannerInstance = null;
let scannerTargetId = null;
function openScanner(targetId){
  scannerTargetId = targetId;
  document.getElementById('scannerModal').classList.remove('hidden');
  document.getElementById('scannerStatus').textContent = 'Point the camera at a barcode or QR code.';
  if(typeof Html5Qrcode === 'undefined'){
    document.getElementById('scannerStatus').textContent = 'Scanner library failed to load. Check your internet connection and try again.';
    return;
  }
  scannerInstance = new Html5Qrcode('scannerViewport');
  scannerInstance.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: 220 },
    (decodedText) => onScanSuccess(decodedText),
    () => {} // ignore per-frame scan failures
  ).catch(err=>{
    document.getElementById('scannerStatus').textContent = 'Could not access camera: '+err+'. Check camera permissions.';
  });
}
function closeScanner(){
  document.getElementById('scannerModal').classList.add('hidden');
  if(scannerInstance){
    scannerInstance.stop().then(()=>scannerInstance.clear()).catch(()=>{});
    scannerInstance = null;
  }
}
function onScanSuccess(decodedText){
  const match = ITEMS.find(i => (i.barcode && i.barcode===decodedText) || i.item_code===decodedText);
  if(match){
    setSearchableItemValue(scannerTargetId, match.id);
    document.getElementById('scannerStatus').textContent = `Matched: ${match.item_code} — ${match.item_name}`;
    setTimeout(closeScanner, 700);
  } else {
    document.getElementById('scannerStatus').textContent = `No item found for code "${decodedText}". Set this item's Barcode field on the Items tab, or check the code.`;
  }
}
function printVoucher(type, r){
  const title = type==='GRN' ? 'Goods Received Note' : 'Stock Issue Voucher';
  const rows = type==='GRN' ? `
    <tr><td>GRN No.</td><td>${r.grn_no}</td></tr>
    <tr><td>Date</td><td>${r.grn_date}</td></tr>
    <tr><td>Store</td><td>${r.stores?.name||''}</td></tr>
    <tr><td>Item</td><td>${r.items?.item_code} — ${r.items?.item_name}</td></tr>
    <tr><td>Batch/Lot</td><td>${r.batch_no}</td></tr>
    <tr><td>Quantity</td><td>${fmt(r.qty)} ${r.items?.uom||''}</td></tr>
    <tr><td>Supplier</td><td>${r.suppliers?.name||'-'}</td></tr>
    <tr><td>PO Ref</td><td>${r.po_ref||'-'}</td></tr>
  ` : `
    <tr><td>Issue No.</td><td>${r.issue_no}</td></tr>
    <tr><td>Date</td><td>${r.issue_date}</td></tr>
    <tr><td>Store</td><td>${r.stores?.name||''}</td></tr>
    <tr><td>Item</td><td>${r.items?.item_code} — ${r.items?.item_name}</td></tr>
    <tr><td>Batch/Lot</td><td>${r.batch_no}</td></tr>
    <tr><td>Quantity</td><td>${fmt(r.qty)} ${r.items?.uom||''}</td></tr>
    <tr><td>Type</td><td>${r.issue_type==='wastage'?'Wastage / Scrap':'Normal Issue'}</td></tr>
    <tr><td>Issued To</td><td>${r.issued_to||'-'}</td></tr>
    <tr><td>Style No.</td><td>${r.style_no||'-'}</td></tr>
    <tr><td>Order Ref</td><td>${r.order_ref||'-'}</td></tr>
  `;
  const w = window.open('', '_blank', 'width=700,height=900');
  w.document.write(`<html><head><title>${title}</title>
    <style>
      body{font-family:Arial,sans-serif;padding:30px;color:#20303A;}
      h1{color:#1F3B4D;border-bottom:2px solid #A65C4A;padding-bottom:10px;font-size:20px;}
      table{width:100%;border-collapse:collapse;margin-top:20px;}
      td{padding:8px;border-bottom:1px solid #ddd;font-size:13px;}
      td:first-child{font-weight:600;width:180px;color:#39756A;}
      .sig{margin-top:70px;display:flex;justify-content:space-between;}
      .sig div{width:180px;border-top:1px solid #333;text-align:center;padding-top:6px;font-size:12px;color:#555;}
    </style></head>
    <body>
      <h1>E-Trims Ltd. — ${title}</h1>
      <table>${rows}</table>
      <div class="sig"><div>Prepared By</div><div>Checked By</div><div>Approved By</div></div>
      <script>window.onload=()=>window.print();<\/script>
    </body></html>`);
  w.document.close();
}

/* ---------------- DASHBOARD ---------------- */
async function renderDashboard(){
  const el = document.getElementById('mainArea');
  el.innerHTML = `<div class="card"><h2>Loading dashboard…</h2></div>`;
  const { data: balances } = await sb.from('v_stock_balance').select('*');
  const rows = balances || [];
  const totalItems = new Set(rows.map(r=>r.item_id)).size;
  const lowStock = rows.filter(r=>r.reorder_level>0 && r.balance_qty < r.reorder_level);
  const byStore = {};
  STORES.forEach(s=> byStore[s.name] = rows.filter(r=>r.store_id===s.id).reduce((a,b)=>a+Number(b.balance_qty||0),0));

  el.innerHTML = `
    <div class="card">
      <h2>Store Overview — ${new Date().toDateString()}</h2>
      <div class="grid">
        <div class="stat"><div class="num">${totalItems}</div><div class="lbl">Active items with stock</div></div>
        <div class="stat ${lowStock.length?'warn':''}"><div class="num">${lowStock.length}</div><div class="lbl">Items below reorder level</div></div>
        <div class="stat"><div class="num">${STORES.length}</div><div class="lbl">Stores tracked</div></div>
      </div>
    </div>
    <div class="card">
      <h2>Stock by Store (total qty across items)</h2>
      <div class="grid">
        ${STORES.map(s=>`<div class="stat"><div class="num">${fmt(byStore[s.name]||0)}</div><div class="lbl">${s.name}</div></div>`).join('')}
      </div>
    </div>
    <div class="card">
      <h2>Low Stock Alerts</h2>
      ${lowStock.length===0 ? '<p class="muted">No items below reorder level.</p>' : `
      <div class="tablewrap"><table>
        <tr><th>Item</th><th>Store</th><th>Batch</th><th>Balance</th><th>Reorder Level</th><th>Status</th></tr>

  document.getElementById('g_po_fld').querySelector('label').textContent = isPurchase ? 'PO Ref' : 'Note (which dept returned it)';
}
function startEditGRN(r){
  editingGrnId = r.id;
  document.getElementById('grnFormTitle').textContent = `Edit GRN — ${r.grn_no}`;
  document.getElementById('g_date').value = r.grn_date;
  document.getElementById('g_type').value = r.grn_type || 'purchase';

  document.getElementById('g_batch').value = r.batch_no;

async function deleteGRN(r){
  if(!confirm(`Delete GRN "${r.grn_no}"? This will reduce stock balance accordingly. Can't be undone.`)) return;
  const { error } = await sb.from('grn').delete().eq('id', r.id);
  if(error){ alert('Error deleting: '+error.message); return; }
  await logAudit('grn', r.id, 'DELETE', r, null);
  await recalcWeightedAvgCost(r.item_id);
  renderGRN();
}
async function submitGRN(ev){
  ev.preventDefault();
  if(!document.getElementById('g_item').value){ alert('Please select a valid item from the list.'); return; }
  const grnType = document.getElementById('g_type').value;
  const payload = {
    grn_date: document.getElementById('g_date').value,
    store_id: document.getElementById('g_store').value, item_id: document.getElementById('g_item').value,
    batch_no: document.getElementById('g_batch').value, qty: parseFloat(document.getElementById('g_qty').value),
    unit_cost: parseFloat(document.getElementById('g_cost').value||0),
    grn_type: grnType,
    supplier_id: grnType==='purchase' ? (document.getElementById('g_supplier').value || null) : null,
    po_ref: grnType==='purchase' ? document.getElementById('g_po').value : (document.getElementById('g_po').value || 'Production Return')
  };
  const itemIdForRecalc = payload.item_id;
  if(editingGrnId){
    if(!isAdmin()){ alert('Only admin can edit existing GRN entries.'); return; }
    const oldRec = (await sb.from('grn').select('*').eq('id', editingGrnId).single()).data;
    const { error } = await sb.from('grn').update(payload).eq('id', editingGrnId);
    if(error){ alert('Error updating GRN: '+error.message); return; }
    await logAudit('grn', editingGrnId, 'UPDATE', oldRec, payload);
  } else {
    payload.grn_no = genNo('GRN');
    payload.created_by = CURRENT_USER.id;
    const { data: inserted, error } = await sb.from('grn').insert(payload).select().single();
    if(error){ alert('Error saving GRN: '+error.message); return; }
    await logAudit('grn', inserted?.id, 'INSERT', null, payload);
  }
  await recalcWeightedAvgCost(itemIdForRecalc);
  renderGRN();
}
async function autoFillGRN(){
  const itemId = document.getElementById('g_item').value;
  if(!itemId) return;
  const item = ITEMS.find(i=>i.id===itemId);
  if(!item) return;
  document.getElementById('g_cost').value = item.standard_cost || 0;
  const dateStr = (document.getElementById('g_date').value || todayStr()).replace(/-/g,'');
  const { count } = await sb.from('grn').select('id',{count:'exact',head:true}).eq('item_id', itemId).eq('grn_date', document.getElementById('g_date').value || todayStr());
  const seq = (count||0)+1;
  document.getElementById('g_batch').value = `${item.item_code}-${dateStr}-${String(seq).padStart(3,'0')}`;
}
async function addSupplierQuick(){
  const name = document.getElementById('g_new_supplier').value.trim();
  if(!name) return;
  const { error } = await sb.from('suppliers').insert({name});
  if(error){ alert('Error adding supplier: '+error.message); return; }
  await loadMasters();
  renderGRN();
}

function loadMoreTransfers(){

function startEditTransfer(r){
  editingTransferId = r.id;
  document.getElementById('transferFormTitle').textContent = `Edit Transfer — ${r.transfer_no}`;
  document.getElementById('t_date').value = r.transfer_date;
  setSearchableItemValue('t_item', r.item_id);
  document.getElementById('t_batch').value = r.batch_no;
  document.getElementById('t_qty').value = r.qty;
  document.getElementById('t_from').value = r.from_store_id;
  document.getElementById('t_to').value = r.to_store_id;
  document.getElementById('t_submit_btn').textContent = 'Update Transfer';
  document.getElementById('t_cancel_wrap').style.display = '';
  document.getElementById('transferFormCard').scrollIntoView({behavior:'smooth'});

async function deleteTransfer(r){
  if(!confirm(`Delete transfer "${r.transfer_no}"? This will reverse the stock movement. Can't be undone.`)) return;
  const { error } = await sb.from('transfers').delete().eq('id', r.id);
  if(error){ alert('Error deleting: '+error.message); return; }
  await logAudit('transfers', r.id, 'DELETE', r, null);
  renderTransfers();
}
async function submitTransfer(ev){
  ev.preventDefault();
  if(!document.getElementById('t_item').value){ alert('Please select a valid item from the list.'); return; }
  const from = document.getElementById('t_from').value, to = document.getElementById('t_to').value;
  if(from===to){ alert('From and To store cannot be the same.'); return; }
  const payload = {
    transfer_date: document.getElementById('t_date').value,
    item_id: document.getElementById('t_item').value, batch_no: document.getElementById('t_batch').value,
    qty: parseFloat(document.getElementById('t_qty').value), from_store_id: from, to_store_id: to
  };
  if(editingTransferId){
    if(!isAdmin()){ alert('Only admin can edit existing transfers.'); return; }
    const oldRec = (await sb.from('transfers').select('*').eq('id', editingTransferId).single()).data;
    const { error } = await sb.from('transfers').update(payload).eq('id', editingTransferId);
    if(error){ alert('Error updating transfer: '+error.message); return; }
    await logAudit('transfers', editingTransferId, 'UPDATE', oldRec, payload);
  } else {
    payload.transfer_no = genNo('TRF');
    payload.created_by = CURRENT_USER.id;
    const { data: inserted, error } = await sb.from('transfers').insert(payload).select().single();
    if(error){ alert('Error saving transfer: '+error.message); return; }
    await logAudit('transfers', inserted?.id, 'INSERT', null, payload);
  }
  renderTransfers();
}

async function loadAgingReport(){
  const rows = (window._stockRows||[]).filter(r=>r.balance_qty>0);
  if(rows.length===0){ document.getElementById('agingTableWrap').innerHTML = '<p class="muted">No stock on hand.</p>'; return; }
  const { data: grnDates } = await sb.from('grn').select('item_id,store_id,batch_no,grn_date');
  const lastGrnDate = {};
  (grnDates||[]).forEach(g=>{
    const k = `${g.store_id}||${g.item_id}||${g.batch_no}`;
    if(!lastGrnDate[k] || g.grn_date > lastGrnDate[k]) lastGrnDate[k] = g.grn_date;
  });
  const today = new Date(todayStr());
  const aged = rows.map(r=>{
    const k = `${r.store_id}||${r.item_id}||${r.batch_no}`;
    const grnDate = lastGrnDate[k];
    if(!grnDate) return null;
    const days = Math.floor((today - new Date(grnDate)) / (1000*60*60*24));
    return { ...r, grnDate, days };
  }).filter(Boolean).sort((a,b)=> b.days - a.days);
  window._agingRows = aged;

  const buckets = { '0-30':0, '31-60':0, '61-90':0, '90+':0 };
  aged.forEach(r=>{
    if(r.days<=30) buckets['0-30']++;
    else if(r.days<=60) buckets['31-60']++;
    else if(r.days<=90) buckets['61-90']++;
    else buckets['90+']++;
  });
  document.getElementById('agingSummary').innerHTML = `
    <div class="grid" style="margin-bottom:16px;">
      <div class="stat"><div class="num">${buckets['0-30']}</div><div class="lbl">0–30 days</div></div>
      <div class="stat"><div class="num">${buckets['31-60']}</div><div class="lbl">31–60 days</div></div>
      <div class="stat warn"><div class="num">${buckets['61-90']}</div><div class="lbl">61–90 days</div></div>
      <div class="stat warn"><div class="num">${buckets['90+']}</div><div class="lbl">90+ days (dead stock risk)</div></div>
    </div>`;
  document.getElementById('agingTableWrap').innerHTML = `
    <table>
      <tr><th>Store</th><th>Item</th><th>Batch</th><th>Balance</th><th>Last GRN Date</th><th>Age (days)</th><th>Status</th></tr>
      ${aged.map(r=>{
        const badge = r.days>90 ? '<span class="badge low">90+ days</span>' : r.days>60 ? '<span class="badge low">61-90 days</span>' : '<span class="badge ok">Fresh</span>';
        return `<tr><td>${r.store_name}</td><td>${r.item_code} — ${r.item_name}</td><td>${r.batch_no||'-'}</td><td>${fmt(r.balance_qty)} ${r.uom}</td><td>${r.grnDate}</td><td>${r.days}</td><td>${badge}</td></tr>`;
      }).join('')}
    </table>`;
}
function exportAgingExcel(){
  const rows = (window._agingRows||[]).map(r=>({
    Store:r.store_name, ItemCode:r.item_code, ItemName:r.item_name, Batch:r.batch_no,
    Balance:r.balance_qty, UOM:r.uom, LastGrnDate:r.grnDate, AgeDays:r.days

async function runLedger(){
  const from = document.getElementById('l_from').value, to = document.getElementById('l_to').value;
  const storeFilter = document.getElementById('l_store').value;
  const resultEl = document.getElementById('ledgerResult');
  resultEl.innerHTML = '<p class="muted">Loading…</p>';

  let q = sb.from('v_daily_movement').select('*').gte('move_date', from).lte('move_date', to);
  const { data: moves, error } = await q;
  if(error){ resultEl.innerHTML = `<p class="muted">Error: ${error.message}</p>`; return; }
  let rows = moves || [];
  if(storeFilter) rows = rows.filter(r=>r.store_id===storeFilter);
  rows.forEach(r=>{ r.items = ITEMS.find(i=>i.id===r.item_id); r.stores = STORES.find(s=>s.id===r.store_id); });

  // opening balance = movement before 'from' date
  let openMoves = (await sb.from('v_daily_movement').select('*').lt('move_date', from)).data || [];
  if(storeFilter) openMoves = openMoves.filter(r=>r.store_id===storeFilter);

  const key = r => `${r.store_id}||${r.item_id}||${r.batch_no}`;
  const opening = {};
  openMoves.forEach(m=>{ const k=key(m); opening[k]=(opening[k]||0)+Number(m.in_qty||0)-Number(m.out_qty||0); });

  const summary = {};
  rows.forEach(r=>{
    const k = key(r);
    if(!summary[k]) summary[k] = {
      store: r.stores?.name, item_id: r.item_id, item_code: r.items?.item_code, item_name: r.items?.item_name,
      uom: r.items?.uom, batch: r.batch_no, in: 0, out: 0
    };
    summary[k].in += Number(r.in_qty||0);
    summary[k].out += Number(r.out_qty||0);
  });
  const summaryRows = Object.entries(summary).map(([k,v])=>{
    const cost = itemCost(v.item_id);
    const openingQty = opening[k]||0;
    const closingQty = openingQty+v.in-v.out;
    return {
      ...v, opening: openingQty, closing: closingQty, cost,
      openingAmt: openingQty*cost, inAmt: v.in*cost, outAmt: v.out*cost, closingAmt: closingQty*cost
    };
  }).sort((a,b)=> a.item_name.localeCompare(b.item_name));

  window._ledgerSummary = summaryRows;
  window._ledgerDetail = rows.sort((a,b)=> a.move_date.localeCompare(b.move_date)).map(r=>{
    const cost = itemCost(r.item_id);
    return { ...r, inAmt: Number(r.in_qty||0)*cost, outAmt: Number(r.out_qty||0)*cost };
  });

  const totalIn = summaryRows.reduce((a,b)=>a+b.in,0);
  const totalOut = summaryRows.reduce((a,b)=>a+b.out,0);
  const totalClosingAmt = summaryRows.reduce((a,b)=>a+b.closingAmt,0);
  const showValue = canSeeValue();

  document.getElementById('ledgerResult').innerHTML = `
    <div class="toolbar">
      <h2 style="margin:0;border:none;padding:0;">Ledger: ${from} to ${to} ${storeFilter? '— '+STORES.find(s=>s.id===storeFilter)?.name : '(All Stores)'}</h2>
      <div class="actions">
        <button class="btn ghost" onclick="exportLedgerPDF()">Export PDF</button>
        <button class="btn ghost" onclick="exportLedgerExcel()">Export Excel</button>
      </div>
    </div>
    <div class="grid" style="margin-bottom:16px;">
      <div class="stat"><div class="num">${summaryRows.length}</div><div class="lbl">Item-batches moved</div></div>
      <div class="stat"><div class="num">${fmt(totalIn)}</div><div class="lbl">Total In (qty)</div></div>
      <div class="stat"><div class="num">${fmt(totalOut)}</div><div class="lbl">Total Out (qty)</div></div>
      ${showValue ? `<div class="stat"><div class="num">৳${fmt(totalClosingAmt)}</div><div class="lbl">Total Closing Value</div></div>` : ''}
    </div>
    <h3 style="font-size:14px;color:var(--navy);">Summary (Opening / In / Out / Closing${showValue?' — Qty &amp; Value':' Qty'})</h3>
    ${showValue ? `<p class="muted">Value columns use each item's Standard Cost (set on the Items tab). Update standard cost there for accurate valuation.</p>` : ''}
    <div class="tablewrap">
      <table>
        <tr><th>Store</th><th>Item</th><th>Batch</th><th>Opening Qty</th><th>In Qty</th><th>Out Qty</th><th>Closing Qty</th>${showValue?'<th>Opening Amt</th><th>In Amt</th><th>Out Amt</th><th>Closing Amt</th>':''}</tr>
        ${summaryRows.map(r=>`<tr><td>${r.store}</td><td>${r.item_code} — ${r.item_name}</td><td>${r.batch}</td><td>${fmt(r.opening)}</td><td>${fmt(r.in)}</td><td>${fmt(r.out)}</td><td><b>${fmt(r.closing)}</b> ${r.uom}</td>${showValue?`<td>৳${fmt(r.openingAmt)}</td><td>৳${fmt(r.inAmt)}</td><td>৳${fmt(r.outAmt)}</td><td><b>৳${fmt(r.closingAmt)}</b></td>`:''}</tr>`).join('')}
      </table>
    </div>
    <h3 style="font-size:14px;color:var(--navy);margin-top:20px;">Detailed Transactions</h3>
    <div class="tablewrap">
      <table>
        <tr><th>Date</th><th>Store</th><th>Item</th><th>Batch</th><th>Type</th><th>Ref No.</th><th>In</th><th>Out</th>${showValue?'<th>In Amt</th><th>Out Amt</th>':''}</tr>
        ${window._ledgerDetail.map(r=>`<tr><td>${r.move_date}</td><td>${r.stores?.name}</td><td>${r.items?.item_code} — ${r.items?.item_name}</td><td>${r.batch_no}</td><td><span class="tag">${r.move_type}</span></td><td>${r.ref_no}</td><td>${r.in_qty?fmt(r.in_qty):''}</td><td>${r.out_qty?fmt(r.out_qty):''}</td>${showValue?`<td>${r.inAmt?'৳'+fmt(r.inAmt):''}</td><td>${r.outAmt?'৳'+fmt(r.outAmt):''}</td>`:''}</tr>`).join('')}
      </table>
    </div>`;
}

/* ---------------- DAILY STOCK CARD (date-wise opening/in/out/closing, single item) ---------------- */
async function runStockCard(){
  const from = document.getElementById('l_from').value, to = document.getElementById('l_to').value;
  const storeFilter = document.getElementById('l_store').value;
  const itemId = document.getElementById('l_item').value;
  const resultEl = document.getElementById('ledgerResult');
  resultEl.innerHTML = '<p class="muted">Loading…</p>';
  if(!itemId){ resultEl.innerHTML = '<p class="muted">Select an item to see its daily stock card.</p>'; return; }

  const item = ITEMS.find(i=>i.id===itemId);

  // opening balance = net of all movement strictly before 'from'
  let openQ = sb.from('v_daily_movement').select('*').eq('item_id', itemId).lt('move_date', from);
  if(storeFilter) openQ = openQ.eq('store_id', storeFilter);
  const { data: beforeMoves } = await openQ;
  let openingBalance = (beforeMoves||[]).reduce((a,m)=> a + Number(m.in_qty||0) - Number(m.out_qty||0), 0);

  // movements within range
  let rangeQ = sb.from('v_daily_movement').select('*').eq('item_id', itemId).gte('move_date', from).lte('move_date', to);
  if(storeFilter) rangeQ = rangeQ.eq('store_id', storeFilter);
  const { data: rangeMoves, error } = await rangeQ;
  if(error){ resultEl.innerHTML = `<p class="muted">Error: ${error.message}</p>`; return; }

  // group by date
  const byDate = {};
  (rangeMoves||[]).forEach(m=>{
    if(!byDate[m.move_date]) byDate[m.move_date] = {in:0, out:0, refs:[]};
    byDate[m.move_date].in += Number(m.in_qty||0);
    byDate[m.move_date].out += Number(m.out_qty||0);
    byDate[m.move_date].refs.push(`${m.move_type} ${m.ref_no}`);
  });
  const dates = Object.keys(byDate).sort();

  let running = openingBalance;
  const cost = itemCost(item.id);
  const cardRows = dates.map(d=>{
    const day = byDate[d];
    const opening = running;
    const closing = opening + day.in - day.out;
    running = closing;
    return {
      date:d, opening, in:day.in, out:day.out, closing, refs: day.refs.join(', '),
      openingAmt: opening*cost, inAmt: day.in*cost, outAmt: day.out*cost, closingAmt: closing*cost
    };
  });
  window._stockCard = cardRows;
  window._stockCardMeta = { item, storeFilter, from, to, openingBalance, cost };
  const showValue = canSeeValue();

  resultEl.innerHTML = `
    <div class="toolbar">
      <h2 style="margin:0;border:none;padding:0;">Daily Stock Card — ${item.item_code} ${item.item_name}</h2>
      <div class="actions">
        <button class="btn ghost" onclick="exportStockCardPDF()">Export PDF</button>
        <button class="btn ghost" onclick="exportStockCardExcel()">Export Excel</button>
      </div>
    </div>
    <p class="muted">${storeFilter? STORES.find(s=>s.id===storeFilter)?.name : 'All Stores combined'} — Opening balance on ${from}: <b>${fmt(openingBalance)} ${item.uom}</b>${showValue?` (Standard Cost: ৳${fmt(cost)}/${item.uom})`:''}</p>
    ${cardRows.length===0 ? `<p class="muted">No movement between ${from} and ${to}. Balance stayed at ${fmt(openingBalance)} ${item.uom}${showValue?` (৳${fmt(openingBalance*cost)})`:''}.</p>` : `
    <div class="tablewrap">
      <table>
        <tr><th>Date</th><th>Opening Qty</th><th>Received</th><th>Issued</th><th>Closing Qty</th>${showValue?'<th>Opening Amt</th><th>Received Amt</th><th>Issued Amt</th><th>Closing Amt</th>':''}<th>Reference</th></tr>

      </table>
    </div>`}`;
}
function exportStockCardExcel(){
  const meta = window._stockCardMeta;
  const showValue = canSeeValue();
  const ws = XLSX.utils.json_to_sheet((window._stockCard||[]).map(r=>{
    const row = { Date:r.date, OpeningQty:r.opening, ReceivedQty:r.in, IssuedQty:r.out, ClosingQty:r.closing };
    if(showValue) Object.assign(row, { UnitCost:meta.cost, OpeningAmt:r.openingAmt, ReceivedAmt:r.inAmt, IssuedAmt:r.outAmt, ClosingAmt:r.closingAmt });
    row.Reference = r.refs;
    return row;
  }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Stock Card');
  XLSX.writeFile(wb, `Stock_Card_${meta.item.item_code}_${meta.from}_to_${meta.to}.xlsx`);
}
function exportStockCardPDF(){
  const meta = window._stockCardMeta;
  const showValue = canSeeValue();
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:'landscape'});
  doc.setFontSize(14); doc.setTextColor(31,59,77);
  doc.text('E-Trims Ltd. — Daily Stock Card', 14, 15);
  doc.setFontSize(10); doc.setTextColor(80,80,80);
  doc.text(`Item: ${meta.item.item_code} — ${meta.item.item_name}`, 14, 22);
  doc.text(`Store: ${meta.storeFilter? STORES.find(s=>s.id===meta.storeFilter)?.name : 'All Stores'}  |  Period: ${meta.from} to ${meta.to}  |  Opening: ${fmt(meta.openingBalance)} ${meta.item.uom}${showValue?`  |  Std Cost: ৳${fmt(meta.cost)}`:''}`, 14, 28);
  const head = showValue
    ? ['Date','Opening Qty','Received','Issued','Closing Qty','Opening Amt','Received Amt','Issued Amt','Closing Amt']
    : ['Date','Opening Qty','Received','Issued','Closing Qty'];
  const body = (window._stockCard||[]).map(r=>{
    const row = [r.date, fmt(r.opening), r.in?fmt(r.in):'', r.out?fmt(r.out):'', fmt(r.closing)];
    if(showValue) row.push(fmt(r.openingAmt), r.inAmt?fmt(r.inAmt):'', r.outAmt?fmt(r.outAmt):'', fmt(r.closingAmt));
    return row;
  });
  doc.autoTable({
    startY: 34,
    head: [head], body: body,
    headStyles:{fillColor:[31,59,77]}, styles:{fontSize:8},
    margin:{left:14,right:14}
  });
  doc.save(`Stock_Card_${meta.item.item_code}_${meta.from}_to_${meta.to}.pdf`);
}

async function importItemsFile(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('it_import_status');
  statusEl.textContent = 'Reading file…';
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const wb = XLSX.read(e.target.result, {type:'binary'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet);
      if(rows.length===0){ statusEl.textContent = 'No rows found in file.'; return; }
      const payloads = rows.map(r=>({
        item_code: String(r.item_code||r.Item_Code||r.ItemCode||'').trim(),
        item_name: String(r.item_name||r.Item_Name||r.ItemName||'').trim(),
        category: String(r.category||r.Category||'').trim() || null,
        uom: String(r.uom||r.UOM||'').trim(),
        reorder_level: parseFloat(r.reorder_level||r.Reorder_Level||0) || 0,
        standard_cost: parseFloat(r.standard_cost||r.Standard_Cost||0) || 0
      })).filter(p=>p.item_code && p.item_name && p.uom);
      if(payloads.length===0){ statusEl.textContent = 'No valid rows — check that item_code, item_name, and uom columns are filled in.'; return; }
      statusEl.textContent = `Importing ${payloads.length} items…`;
      const { data: inserted, error } = await sb.from('items').insert(payloads).select();
      if(error){ statusEl.textContent = 'Import error: '+error.message; return; }
      await logAudit('items', 'bulk', 'INSERT', null, {count: payloads.length, source: file.name});
      statusEl.textContent = `Imported ${inserted?.length||payloads.length} items successfully.`;
      await loadMasters(); renderItems();
    }catch(err){
      statusEl.textContent = 'Could not read file: '+err.message;
    }
  };
  reader.readAsBinaryString(file);
}
function startEditItem(i){
  editingItemId = i.id;

  document.getElementById('it_code').value = i.item_code;
  document.getElementById('it_name').value = i.item_name;
  const catSelect = document.getElementById('it_cat');
  const knownCat = Array.from(catSelect.options).some(o=>o.value===i.category);
  if(knownCat){ catSelect.value = i.category; } else { catSelect.value = 'Other'; document.getElementById('it_cat_other').classList.remove('hidden'); document.getElementById('it_cat_other').value = i.category || ''; }
  const uomSelect = document.getElementById('it_uom');
  const knownUom = Array.from(uomSelect.options).some(o=>o.value===i.uom);
  if(knownUom){ uomSelect.value = i.uom; } else { uomSelect.value = 'Other'; document.getElementById('it_uom_other').classList.remove('hidden'); document.getElementById('it_uom_other').value = i.uom || ''; }

async function deleteItem(id, code){
  if(!confirm(`Delete item "${code}"? This will fail if GRN/Issue/Transfer records already reference it. Can't be undone.`)) return;
  const oldRec = ITEMS.find(i=>i.id===id);
  const { error } = await sb.from('items').delete().eq('id', id);
  if(error){ alert('Cannot delete: '+error.message+'\n\nThis item likely has existing GRN, Issue, or Transfer records. Consider editing it instead, or mark it inactive.'); return; }
  await logAudit('items', id, 'DELETE', oldRec, null);
  await loadMasters(); renderItems();
}
async function submitItem(ev){
  ev.preventDefault();
  const catSelect = document.getElementById('it_cat').value;

  const payload = {
    item_code: document.getElementById('it_code').value, item_name: document.getElementById('it_name').value,
    category: category, uom: uom,

    barcode: document.getElementById('it_barcode').value.trim() || null
  };
  if(editingItemId){
    if(!isAdmin()){ alert('Only admin can edit existing items.'); return; }
    const oldRec = ITEMS.find(i=>i.id===editingItemId);
    const { error } = await sb.from('items').update(payload).eq('id', editingItemId);
    if(error){ alert('Error: '+error.message); return; }
    await logAudit('items', editingItemId, 'UPDATE', oldRec, payload);
  } else {
    const { data: inserted, error } = await sb.from('items').insert(payload).select().single();
    if(error){ alert('Error: '+error.message); return; }
    await logAudit('items', inserted?.id, 'INSERT', null, payload);
  }
  await loadMasters(); renderItems();
}

function addPoLine(ev){
  ev.preventDefault();
  const itemId = document.getElementById('po_item').value;
  if(!itemId){ alert('Please select a valid item from the list.'); return; }
  const item = ITEMS.find(i=>i.id===itemId);
  const qty = parseFloat(document.getElementById('po_qty').value);
  const price = parseFloat(document.getElementById('po_price').value||0);
  poLineDraft.push({ item_id: itemId, item_code: item.item_code, item_name: item.item_name, uom: item.uom, qty_ordered: qty, unit_price: price });
  document.getElementById('po_qty').value = '';
  document.getElementById('po_price').value = '0';
  document.getElementById('po_item_search').value = '';
  document.getElementById('po_item').value = '';
  renderPoLinesDraft();

function removePoLine(idx){
  poLineDraft.splice(idx,1);
  renderPoLinesDraft();
}
function renderPoLinesDraft(){
  document.getElementById('poLinesWrap').innerHTML = poLineDraft.length===0 ? '<p class="muted">No lines added yet.</p>' : `
    <table style="margin-top:8px;">
      <tr><th>Item</th><th>Qty Ordered</th><th>Unit Price</th><th>Line Total</th><th></th></tr>
      ${poLineDraft.map((l,idx)=>`<tr><td>${l.item_code} — ${l.item_name}</td><td>${fmt(l.qty_ordered)} ${l.uom}</td><td>৳${fmt(l.unit_price)}</td><td>৳${fmt(l.qty_ordered*l.unit_price)}</td><td><button class="btn rust" style="padding:4px 8px;font-size:11px;" onclick="removePoLine(${idx})">Remove</button></td></tr>`).join('')}
    </table>`;

async function submitPO(){
  if(poLineDraft.length===0){ alert('Add at least one line item.'); return; }
  const payload = {
    po_no: genNo('PO'), po_date: document.getElementById('po_date').value,
    supplier_id: document.getElementById('po_supplier').value || null,
    remarks: document.getElementById('po_remarks').value, status: 'open',
    created_by: CURRENT_USER.id
  };
  const { data: po, error } = await sb.from('purchase_orders').insert(payload).select().single();
  if(error){ alert('Error saving PO: '+error.message); return; }
  const lines = poLineDraft.map(l=>({ po_id: po.id, item_id: l.item_id, qty_ordered: l.qty_ordered, unit_price: l.unit_price }));
  const { error: lineErr } = await sb.from('po_lines').insert(lines);
  if(lineErr){ alert('PO saved but lines failed: '+lineErr.message); return; }
  await logAudit('purchase_orders', po.id, 'INSERT', null, {...payload, lines: poLineDraft.length});
  renderPO();
}
async function deletePO(id, poNo){
  if(!confirm(`Delete PO "${poNo}"? This will remove its line items too. Any GRN already received against it will keep its history but lose the link. Can't be undone.`)) return;
  const { error } = await sb.from('purchase_orders').delete().eq('id', id);
  if(error){ alert('Error: '+error.message); return; }
  await logAudit('purchase_orders', id, 'DELETE', {po_no: poNo}, null);

/* ---------------- PHYSICAL STOCK COUNT / RECONCILIATION ---------------- */
async function renderStockCount(){
  const el = document.getElementById('mainArea');
  const editable = canEdit('stockcount');
  const adminMode = isAdmin();
  const { data: counts } = await sb.from('stock_counts').select('*,stores(name)').order('created_at',{ascending:false}).limit(30);
  window._countsList = counts || [];
  el.innerHTML = `
    ${editable ? `
    <div class="card">
      <h2>Start New Stock Count</h2>
      <form class="inline" onsubmit="startStockCount(event)">
        <div class="fld"><label>Count Date</label><input type="date" id="sc_date" value="${todayStr()}"></div>
        <div class="fld"><label>Store</label><select id="sc_store" required><option value="">Select</option>${storeOptions()}</select></div>
        <div class="fld"><button class="btn" type="submit">Start Count</button></div>
      </form>
      <p class="muted">This loads the current system balance for every item in that store, so you can enter what you physically counted next to it.</p>
    </div>` : noEditNotice('Stock Count')}
    <div class="card">
      <h2>Past Counts</h2>
      <div class="tablewrap"><table>
        <tr><th>Count No.</th><th>Date</th><th>Store</th><th>Status</th><th>Actions</th></tr>
        ${window._countsList.map(c=>`<tr><td>${c.count_no}</td><td>${c.count_date}</td><td>${c.stores?.name||''}</td><td><span class="badge ${c.status==='finalized'?'ok':'low'}">${c.status}</span></td><td><button class="btn ghost" style="padding:5px 10px;font-size:12px;" onclick="openStockCount('${c.id}')">Open</button></td></tr>`).join('')}
      </table></div>
    </div>
    <div class="card hidden" id="countDetailCard"></div>`;
}
async function startStockCount(ev){
  ev.preventDefault();
  const storeId = document.getElementById('sc_store').value;
  const { data: balances } = await sb.from('v_stock_balance').select('*').eq('store_id', storeId);
  const rows = (balances||[]).filter(r=>r.balance_qty !== 0 || r.batch_no);
  const payload = { count_no: genNo('CNT'), count_date: document.getElementById('sc_date').value, store_id: storeId, status: 'draft', created_by: CURRENT_USER.id };
  const { data: count, error } = await sb.from('stock_counts').insert(payload).select().single();
  if(error){ alert('Error: '+error.message); return; }
  const lines = rows.map(r=>({ count_id: count.id, item_id: r.item_id, batch_no: r.batch_no, system_qty: r.balance_qty, counted_qty: null, variance: 0 }));
  if(lines.length>0) await sb.from('stock_count_lines').insert(lines);
  await logAudit('stock_counts', count.id, 'INSERT', null, {...payload, line_count: lines.length});
  renderStockCount();
  setTimeout(()=>openStockCount(count.id), 300);
}
async function openStockCount(countId){
  const { data: count } = await sb.from('stock_counts').select('*,stores(name)').eq('id', countId).single();
  const { data: lines } = await sb.from('stock_count_lines').select('*,items(item_code,item_name,uom)').eq('count_id', countId).order('id');
  window._currentCount = count;
  window._currentCountLines = lines || [];
  const card = document.getElementById('countDetailCard');
  card.classList.remove('hidden');
  const isDraft = count.status === 'draft';
  const canFinalize = isAdmin() || canEdit('stockcount');
  card.innerHTML = `
    <div class="toolbar">
      <h2 style="margin:0;border:none;padding:0;">Count ${count.count_no} — ${count.stores?.name} (${count.count_date})</h2>
      <span class="badge ${isDraft?'low':'ok'}">${count.status}</span>
    </div>
    <div class="tablewrap"><table>
      <tr><th>Item</th><th>Batch</th><th>System Qty</th><th>Counted Qty</th><th>Variance</th></tr>
      ${(lines||[]).map(l=>`<tr><td>${l.items?.item_code} — ${l.items?.item_name}</td><td>${l.batch_no||'-'}</td><td>${fmt(l.system_qty)}</td><td>${isDraft ? `<input type="number" step="0.01" value="${l.counted_qty ?? ''}" style="width:100px;" onchange="updateCountLine('${l.id}', this.value)">` : fmt(l.counted_qty)}</td><td id="variance_${l.id}">${l.counted_qty!==null ? fmt(l.counted_qty-l.system_qty) : '-'}</td></tr>`).join('')}
    </table></div>
    ${isDraft && canFinalize ? `<button class="btn" style="margin-top:14px;" onclick="finalizeStockCount('${count.id}')">Finalize Count &amp; Post Adjustments</button> <p class="muted">Finalizing creates GRN entries (Production Return type) for positive variance and Issue entries (Wastage type) for negative variance, so system stock matches what you physically counted.</p>` : ''}
    <button class="btn ghost" style="margin-top:14px;" onclick="document.getElementById('countDetailCard').classList.add('hidden')">Close</button>`;
  card.scrollIntoView({behavior:'smooth'});
}
async function updateCountLine(lineId, val){
  const counted = val==='' ? null : parseFloat(val);
  const line = window._currentCountLines.find(l=>l.id===lineId);
  const variance = counted!==null ? counted - line.system_qty : 0;
  await sb.from('stock_count_lines').update({ counted_qty: counted, variance }).eq('id', lineId);
  line.counted_qty = counted; line.variance = variance;
  document.getElementById('variance_'+lineId).textContent = counted!==null ? fmt(variance) : '-';
}
async function finalizeStockCount(countId){
  const lines = window._currentCountLines.filter(l=>l.counted_qty!==null && l.counted_qty !== l.system_qty);
  if(!confirm(`Finalize this count? ${lines.length} item(s) have a variance and will get adjustment entries posted. This can't be undone.`)) return;
  const count = window._currentCount;
  for(const l of lines){
    const diff = l.counted_qty - l.system_qty;
    if(diff > 0){
      await sb.from('grn').insert({
        grn_no: genNo('GRN'), grn_date: count.count_date, store_id: count.store_id, item_id: l.item_id,
        batch_no: l.batch_no || 'COUNT-ADJ', qty: diff, unit_cost: 0, grn_type: 'production_return',
        po_ref: `Stock count adjustment — ${count.count_no}`, created_by: CURRENT_USER.id
      });
    } else if(diff < 0){
      await sb.from('issues').insert({
        issue_no: genNo('ISS'), issue_date: count.count_date, store_id: count.store_id, item_id: l.item_id,
        batch_no: l.batch_no || 'COUNT-ADJ', qty: Math.abs(diff), issue_type: 'wastage',
        issued_to: `Stock count adjustment — ${count.count_no}`, created_by: CURRENT_USER.id
      });
    }
  }
  await sb.from('stock_counts').update({ status: 'finalized', finalized_by: CURRENT_USER.id, finalized_at: new Date().toISOString() }).eq('id', countId);
  await logAudit('stock_counts', countId, 'UPDATE', {status:'draft'}, {status:'finalized', adjustments: lines.length});
  await loadMasters();
  renderStockCount();
}

/* ---------------- BUYER / ORDER-LEVEL STOCK RESERVATION ---------------- */
async function renderReservations(){
  const el = document.getElementById('mainArea');
  const editable = canEdit('reservations');
  const adminMode = isAdmin();
  const { data: reservations } = await sb.from('reservations').select('*,items(item_code,item_name,uom),stores(name)').eq('status','active').order('created_at',{ascending:false});
  const { data: balances } = await sb.from('v_stock_balance').select('*');
  window._reservationsList = reservations || [];
  window._balancesForReservations = balances || [];
  el.innerHTML = `
    ${editable ? `
    <div class="card">
      <h2>New Reservation</h2>
      <form class="inline" onsubmit="submitReservation(event)">
        <div class="fld"><label>Item</label>${searchableItemSelect('rv_item')}</div>
        <div class="fld"><label>Store</label><select id="rv_store" required><option value="">Select</option>${storeOptions()}</select></div>
        <div class="fld"><label>Qty to Reserve</label><input type="number" id="rv_qty" step="0.01" min="0.01" required></div>
        <div class="fld"><label>Order / Job Ref</label><input id="rv_ref" placeholder="Buyer PO / Job card"></div>
        <div class="fld"><label>Style No.</label><input id="rv_style" placeholder="Buyer style number"></div>
        <div class="fld"><button class="btn" type="submit">Reserve Stock</button></div>
      </form>
    </div>` : noEditNotice('Reservations')}
    <div class="card">
      <h2>Active Reservations</h2>
      <p class="muted">Reserved stock is held against an order but not physically moved yet — it reduces what's shown as "Available" below, without changing actual store balance.</p>
      <div class="tablewrap"><table>
        <tr><th>Item</th><th>Store</th><th>Reserved Qty</th><th>Order Ref</th><th>Style No.</th><th>Available at Reservation</th><th>Actions</th></tr>
        ${window._reservationsList.map(r=>{
          const bal = window._balancesForReservations.filter(b=>b.item_id===r.item_id && b.store_id===r.store_id).reduce((a,b)=>a+Number(b.balance_qty||0),0);
          return `<tr><td>${r.items?.item_code} — ${r.items?.item_name}</td><td>${r.stores?.name}</td><td>${fmt(r.qty)} ${r.items?.uom||''}</td><td>${r.order_ref||'-'}</td><td>${r.style_no||'-'}</td><td>${fmt(bal)}</td><td><button class="btn ghost" style="padding:5px 10px;font-size:12px;" onclick="fulfillReservation('${r.id}')">Mark Fulfilled</button> <button class="btn rust" style="padding:5px 10px;font-size:12px;" onclick="releaseReservation('${r.id}')">Release</button></td></tr>`;
        }).join('')}
      </table></div>
      ${window._reservationsList.length===0 ? '<p class="muted">No active reservations.</p>' : ''}
    </div>`;
}
async function submitReservation(ev){
  ev.preventDefault();
  const itemId = document.getElementById('rv_item').value;
  if(!itemId){ alert('Please select a valid item from the list.'); return; }
  const payload = {
    item_id: itemId, store_id: document.getElementById('rv_store').value,
    qty: parseFloat(document.getElementById('rv_qty').value),
    order_ref: document.getElementById('rv_ref').value, style_no: document.getElementById('rv_style').value,
    status: 'active', created_by: CURRENT_USER.id
  };
  const { data: inserted, error } = await sb.from('reservations').insert(payload).select().single();
  if(error){ alert('Error: '+error.message); return; }
  await logAudit('reservations', inserted?.id, 'INSERT', null, payload);
  renderReservations();
}
async function releaseReservation(id){
  if(!confirm('Release this reservation? The reserved quantity becomes available again.')) return;
  const { error } = await sb.from('reservations').update({status:'released'}).eq('id', id);
  if(error){ alert('Error: '+error.message); return; }
  await logAudit('reservations', id, 'UPDATE', {status:'active'}, {status:'released'});
  renderReservations();
}
async function fulfillReservation(id){
  if(!confirm('Mark this reservation as fulfilled? This just closes it out for tracking — actual stock should already have been issued separately.')) return;
  const { error } = await sb.from('reservations').update({status:'fulfilled'}).eq('id', id);
  if(error){ alert('Error: '+error.message); return; }
  await logAudit('reservations', id, 'UPDATE', {status:'active'}, {status:'fulfilled'});
  renderReservations();
}

/* ---------------- USERS (admin only) ---------------- */
let editingUserId = null;
async function renderUsers(){
  const el = document.getElementById('mainArea');
  const { data: users } = await sb.from('app_users').select('*').order('created_at');
  const editable = canEdit('users');
  editingUserId = null;
  el.innerHTML = `
    ${editable ? `
    <div class="card" id="userFormCard">
      <h2 id="userFormTitle">Add User</h2>
      <form class="inline" onsubmit="submitUser(event)">
        <div class="fld"><label>Username</label><input id="u_user" required></div>
        <div class="fld"><label>Password <span class="muted" id="u_pass_hint"></span></label><input id="u_pass"></div>
        <div class="fld"><label>Full Name</label><input id="u_name" required></div>
        <div class="fld"><label>Role</label>
          <select id="u_role">
            <option value="store_manager">Store Manager</option>
            <option value="store_keeper">Store Keeper (entry)</option>
            <option value="accounts">Accounts</option>
            <option value="management">Management</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div class="fld"><label>Active</label>
          <select id="u_active"><option value="true">Yes</option><option value="false">No</option></select>
        </div>
        <div class="fld"><button class="btn" type="submit" id="u_submit_btn">Save User</button></div>
        <div class="fld" id="u_cancel_wrap" style="display:none;"><button class="btn ghost" type="button" onclick="cancelEditUser()">Cancel</button></div>
      </form>
    </div>` : noEditNotice('Users')}
    <div class="card">
      <h2>Users</h2>
      <div class="tablewrap"><table>
        <tr><th>Username</th><th>Full Name</th><th>Role</th><th>Active</th>${editable?'<th>Actions</th>':''}</tr>
        ${(users||[]).map(u=>`<tr><td>${u.username}</td><td>${u.full_name}</td><td>${u.role}</td><td>${u.is_active?'Yes':'No'}</td>${editable?`<td><button class="btn ghost" style="padding:5px 10px;font-size:12px;" onclick='startEditUser(${JSON.stringify(u)})'>Edit</button> <button class="btn rust" style="padding:5px 10px;font-size:12px;" onclick="deleteUser('${u.id}','${u.username}')">Delete</button></td>`:''}</tr>`).join('')}
      </table></div>
    </div>`;
}
function startEditUser(u){
  editingUserId = u.id;
  document.getElementById('userFormTitle').textContent = `Edit User — ${u.username}`;
  document.getElementById('u_user').value = u.username;
  document.getElementById('u_pass').value = '';
  document.getElementById('u_pass_hint').textContent = '(leave blank to keep current password)';
  document.getElementById('u_name').value = u.full_name;
  document.getElementById('u_role').value = u.role;
  document.getElementById('u_active').value = String(u.is_active);
  document.getElementById('u_submit_btn').textContent = 'Update User';
  document.getElementById('u_cancel_wrap').style.display = '';
  document.getElementById('userFormCard').scrollIntoView({behavior:'smooth'});
}
function cancelEditUser(){
  renderUsers();
}
async function deleteUser(id, username){
  if(id === CURRENT_USER.id){ alert("You can't delete your own account while logged in."); return; }
  if(!confirm(`Delete user "${username}"? This can't be undone.`)) return;
  const { data: oldRec } = await sb.from('app_users').select('id,username,full_name,role,is_active').eq('id', id).single();
  const { error } = await sb.from('app_users').delete().eq('id', id);
  if(error){ alert('Error deleting user: '+error.message); return; }
  await logAudit('app_users', id, 'DELETE', oldRec, null);
  renderUsers();
}
async function submitUser(ev){
  ev.preventDefault();
  const payload = {
    username: document.getElementById('u_user').value,
    full_name: document.getElementById('u_name').value,
    role: document.getElementById('u_role').value,
    is_active: document.getElementById('u_active').value === 'true'
  };
  const pass = document.getElementById('u_pass').value;
  const auditPayload = { ...payload }; // never log password contents

  if(editingUserId){
    if(pass) payload.password_hash = pass;
    const { data: oldRec } = await sb.from('app_users').select('id,username,full_name,role,is_active').eq('id', editingUserId).single();
    const { error } = await sb.from('app_users').update(payload).eq('id', editingUserId);
    if(error){ alert('Error: '+error.message); return; }
    await logAudit('app_users', editingUserId, 'UPDATE', oldRec, { ...auditPayload, password_changed: !!pass });
  } else {
    if(!pass){ alert('Password is required for a new user.'); return; }
    payload.password_hash = pass;
    const { data: inserted, error } = await sb.from('app_users').insert(payload).select().single();
    if(error){ alert('Error: '+error.message); return; }
    await logAudit('app_users', inserted?.id, 'INSERT', null, auditPayload);
  }
  renderUsers();
}

/* ---------------- PERMISSIONS MATRIX (admin only) ---------------- */
async function renderPermissions(){
  const el = document.getElementById('mainArea');
  el.innerHTML = `<div class="card"><h2>Loading permissions…</h2></div>`;
  const { data } = await sb.from('role_permissions').select('*');
  const perms = {};
  (data||[]).forEach(r => { perms[`${r.role}||${r.page_id}`] = r; });

  const rolePages = PAGE_DEFS.filter(p => p.id !== 'permissions');

  el.innerHTML = `
    <div class="card">
      <div class="toolbar">
        <h2 style="margin:0;border:none;padding:0;">Role Permissions</h2>
        <div class="actions"><button class="btn" onclick="savePermissions()">Save Changes</button></div>
      </div>
      <p class="muted">Controls what each role can see (View) and change (Edit) on every page. Admin always has full access and isn't shown here. Changes apply the next time that user logs in or refreshes.</p>
      <div class="tablewrap">
        <table>
          <tr>
            <th>Role</th>
            ${rolePages.map(p=>`<th colspan="2" style="text-align:center;">${p.label}</th>`).join('')}
          </tr>
          <tr>
            <th></th>
            ${rolePages.map(()=>`<th style="text-align:center;font-size:11px;">View</th><th style="text-align:center;font-size:11px;">Edit</th>`).join('')}
          </tr>
          ${ASSIGNABLE_ROLES.filter(r=>r!=='admin').map(role=>`
            <tr>
              <td><b>${role.replace('_',' ')}</b></td>
              ${rolePages.map(p=>{
                const rec = perms[`${role}||${p.id}`] || {can_view:false, can_edit:false};
                return `
                  <td style="text-align:center;"><input type="checkbox" id="perm_v_${role}_${p.id}" ${rec.can_view?'checked':''} onchange="if(!this.checked) document.getElementById('perm_e_${role}_${p.id}').checked=false;"></td>
                  <td style="text-align:center;"><input type="checkbox" id="perm_e_${role}_${p.id}" ${rec.can_edit?'checked':''} onchange="if(this.checked) document.getElementById('perm_v_${role}_${p.id}').checked=true;"></td>`;
              }).join('')}
            </tr>`).join('')}
        </table>
      </div>
    </div>`;
}
async function savePermissions(){
  const rolePages = PAGE_DEFS.filter(p => p.id !== 'permissions');
  const rows = [];
  ASSIGNABLE_ROLES.filter(r=>r!=='admin').forEach(role=>{
    rolePages.forEach(p=>{
      const v = document.getElementById(`perm_v_${role}_${p.id}`).checked;
      const e = document.getElementById(`perm_e_${role}_${p.id}`).checked;
      rows.push({role, page_id: p.id, can_view: v, can_edit: e});
    });
  });
  const { error } = await sb.from('role_permissions').upsert(rows, {onConflict:'role,page_id'});
  if(error){ alert('Error saving permissions: '+error.message); return; }
  alert('Permissions saved. They will apply next time each user logs in or refreshes the page.');
  if(CURRENT_USER.role==='admin') renderPermissions();
}
</script>
